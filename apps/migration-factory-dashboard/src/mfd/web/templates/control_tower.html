<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migration Factory Control Tower</title>
<style>
/* ═══ AVANADE DESIGN TOKENS ══════════════════════════════════════════ */
:root{
  color-scheme: light;
  /* Brand — Avanade Orange */
  --r:#ff5800; --rd:#cc4400; --rl:#ff7a44;
  /* Surfaces */
  --k:#ffffff; --d1:#f5f5f7; --d2:#ffffff; --d3:#f0f0f4; --d4:#e8e8ec;
  --bg-page:#f4f4f7;
  /* Neutral / text */
  --g1:#cccccc; --g2:#888891; --g3:#555559;
  --fg:#1a1a1a; --fg-dim:rgba(26,26,26,.72); --fg-muted:rgba(26,26,26,.55); --fg-faint:rgba(26,26,26,.40);
  /* Borders */
  --wb:rgba(0,0,0,.08); --wb2:rgba(0,0,0,.14); --rb:rgba(255,88,0,.12);
  --hover-bg:rgba(0,0,0,.04);
  /* Semantic (reservado para estado, nunca para série) */
  --ok:#00963c; --warn:#cc7a00; --bad:#c62828; --info:#1565c0;
  --ok-bg:rgba(0,150,60,.10); --warn-bg:rgba(204,122,0,.12); --bad-bg:rgba(198,40,40,.10);
  /* Séries categóricas — validadas p/ CVD sobre a superfície clara */
  --s1:#d24800; --s2:#1565c0; --s3:#008a5e;
  /* Rampa sequencial (magnitude) — hue único da marca */
  --q0:#fdf0e8; --q1:#fbd3bb; --q2:#f5a97e; --q3:#e97a3f; --q4:#d24800; --q5:#8f3100;
  --grid:#e3e3e9; --axis:#c9c9d2;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -18px rgba(0,0,0,.35);
  --rad:7px; --rad2:11px; --tr:.16s ease;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --k:#0a0a0a; --d1:#141414; --d2:#1c1c1c; --d3:#242424; --d4:#2e2e2e;
    --bg-page:#0d0d0d;
    --g1:#3d3d3d; --g2:#6b6b6b; --g3:#9e9e9e;
    --fg:#ffffff; --fg-dim:rgba(255,255,255,.72); --fg-muted:rgba(255,255,255,.55); --fg-faint:rgba(255,255,255,.45);
    --wb:rgba(255,255,255,.10); --wb2:rgba(255,255,255,.16); --rb:rgba(255,88,0,.22);
    --hover-bg:rgba(255,255,255,.05);
    --ok:#3ec46f; --warn:#e8a33d; --bad:#ef5350; --info:#4a9eea;
    --ok-bg:rgba(62,196,111,.14); --warn-bg:rgba(232,163,61,.16); --bad-bg:rgba(239,83,80,.14);
    --s1:#e5622c; --s2:#2e86d8; --s3:#1f9c72;
    --q0:#2a1a10; --q1:#4a2a16; --q2:#7d431f; --q3:#b05a26; --q4:#e5622c; --q5:#ff8c5a;
    --grid:#262626; --axis:#3a3a3a;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --k:#0a0a0a; --d1:#141414; --d2:#1c1c1c; --d3:#242424; --d4:#2e2e2e;
  --bg-page:#0d0d0d;
  --g1:#3d3d3d; --g2:#6b6b6b; --g3:#9e9e9e;
  --fg:#ffffff; --fg-dim:rgba(255,255,255,.72); --fg-muted:rgba(255,255,255,.55); --fg-faint:rgba(255,255,255,.45);
  --wb:rgba(255,255,255,.10); --wb2:rgba(255,255,255,.16); --rb:rgba(255,88,0,.22);
  --hover-bg:rgba(255,255,255,.05);
  --ok:#3ec46f; --warn:#e8a33d; --bad:#ef5350; --info:#4a9eea;
  --ok-bg:rgba(62,196,111,.14); --warn-bg:rgba(232,163,61,.16); --bad-bg:rgba(239,83,80,.14);
  --s1:#e5622c; --s2:#2e86d8; --s3:#1f9c72;
  --q0:#2a1a10; --q1:#4a2a16; --q2:#7d431f; --q3:#b05a26; --q4:#e5622c; --q5:#ff8c5a;
  --grid:#262626; --axis:#3a3a3a;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page); color:var(--fg);
  font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.mono{font-family:Consolas,"Cascadia Mono",ui-monospace,monospace}
button{font:inherit;color:inherit}

/* ═══ TOPBAR ═════════════════════════════════════════════════════════ */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:16px;
  height:56px; padding:0 22px;
  background:var(--d2); border-bottom:1px solid var(--wb);
}
.tm-logo{display:flex;align-items:center;flex-shrink:0}
.tm-logo svg{height:26px;width:auto;display:block}
.tm-title{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tm-title b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.tm-title span{font-size:11px;color:var(--fg-muted);white-space:nowrap}
.tm-sep{width:1px;height:26px;background:var(--wb2);flex:none}
.tm-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.tm-stamp{font-size:11px;color:var(--fg-faint);white-space:nowrap}
#theme-btn{
  background:none;border:1px solid var(--wb);border-radius:var(--rad);
  padding:5px 11px;cursor:pointer;display:flex;align-items:center;gap:6px;
  font-size:11px;transition:background var(--tr);
}
#theme-btn:hover{background:var(--hover-bg)}
.langsw{display:flex;border:1px solid var(--wb);border-radius:var(--rad);overflow:hidden;flex:none}
.langsw button{
  appearance:none;background:none;border:none;padding:5px 10px;cursor:pointer;
  font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--fg-muted);
  transition:background var(--tr),color var(--tr);
}
.langsw button+button{border-left:1px solid var(--wb)}
.langsw button:hover{background:var(--hover-bg);color:var(--fg)}
.langsw button[aria-pressed="true"]{background:var(--r);color:#fff}
.langsw button:focus-visible{outline:2px solid var(--r);outline-offset:-2px}

/* ═══ TABS ═══════════════════════════════════════════════════════════ */
.tabstrip{
  position:sticky; top:56px; z-index:39;
  display:flex; gap:2px; padding:0 22px; overflow-x:auto;
  background:var(--d2); border-bottom:1px solid var(--wb);
}
.tab{
  appearance:none;background:none;border:none;border-bottom:2px solid transparent;
  padding:11px 14px 9px;cursor:pointer;white-space:nowrap;
  font-size:12.5px;font-weight:500;color:var(--fg-muted);transition:color var(--tr);
}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--r);border-bottom-color:var(--r);font-weight:600}
.tab:focus-visible,.fbtn:focus-visible,.row:focus-visible,.cell:focus-visible,
input:focus-visible,select:focus-visible{outline:2px solid var(--r);outline-offset:2px}

/* ═══ FILTER BAR ═════════════════════════════════════════════════════ */
.filterbar{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;
  padding:12px 22px;background:var(--d1);border-bottom:1px solid var(--wb);
}
.fgroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgroup > label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-faint)}
.fctl{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
select,input[type="date"],input[type="number"]{
  background:var(--d2);border:1px solid var(--wb2);border-radius:var(--rad);
  padding:5px 8px;font-size:12px;color:var(--fg);min-width:0;
}
input[type="number"]{width:88px;text-align:right;font-family:Consolas,monospace}
.fbtn{
  background:var(--d2);border:1px solid var(--wb2);border-radius:99px;
  padding:4px 11px;font-size:11.5px;cursor:pointer;color:var(--fg-dim);
  transition:background var(--tr),border-color var(--tr);
}
.fbtn:hover{background:var(--hover-bg)}
.fbtn[aria-pressed="true"]{background:var(--r);border-color:var(--r);color:#fff;font-weight:600}
.fbtn.ghost{border-style:dashed}
.fscope{margin-left:auto;font-size:11.5px;color:var(--fg-muted);white-space:nowrap;align-self:center}
.fscope b{color:var(--fg);font-weight:600}

/* ═══ LAYOUT ═════════════════════════════════════════════════════════ */
.page{padding:20px 22px 64px;max-width:1560px;margin:0 auto}
.pagehead{margin:0 0 16px}
.pagehead h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 3px}
.pagehead p{margin:0;font-size:12.5px;color:var(--fg-muted);max-width:88ch}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(390px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.span2{grid-column:1/-1}

/* ═══ KPI CARDS ══════════════════════════════════════════════════════ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:16px}
.kpi{
  background:var(--d2);border:1px solid var(--wb);border-radius:var(--rad2);
  padding:13px 15px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--r);opacity:.85}
.kpi.k-ok::before{background:var(--ok)} .kpi.k-warn::before{background:var(--warn)}
.kpi.k-bad::before{background:var(--bad)} .kpi.k-mute::before{background:var(--g2)}
.kpi .lab{font-size:11px;color:var(--fg-muted);margin:0 0 4px;line-height:1.25}
.kpi .val{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.1}
.kpi .sub{font-size:10.5px;color:var(--fg-faint);margin:4px 0 0;line-height:1.3}

/* ═══ CARDS ══════════════════════════════════════════════════════════ */
.card{
  background:var(--d2);border:1px solid var(--wb);border-radius:var(--rad2);
  padding:16px 18px 14px;box-shadow:var(--shadow);min-width:0;
}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:2px}
.card h2{font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin:0}
.card .sub{font-size:11.5px;color:var(--fg-muted);margin:2px 0 14px;max-width:80ch}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-left:auto}
.legend .item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-dim)}
.legend .sw{width:10px;height:10px;border-radius:2px;flex:none}
.legend .sw.line{height:2px;border-radius:1px;width:14px}
.legend .gl{width:13px;height:13px;border-radius:3px;flex:none;display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;line-height:1}

/* ═══ BAR CHART ══════════════════════════════════════════════════════ */
.plot{position:relative}
.gridlines{position:absolute;top:0;bottom:0;pointer-events:none}
.gridlines span{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.gridlines span.zero{background:var(--axis)}
.rows{position:relative;display:flex;flex-direction:column;gap:3px}
.row{
  display:grid;grid-template-columns:var(--labw,150px) 1fr var(--valw,80px);
  align-items:center;gap:12px;min-height:24px;padding:1px 0;border-radius:5px;
}
.row:hover{background:var(--hover-bg)}
.row.clickable{cursor:pointer}
.row .rlab{font-family:Consolas,monospace;font-size:10.5px;color:var(--fg-dim);line-height:1.25;overflow-wrap:anywhere}
.row .rlab .flag{display:block;font-size:9.5px;color:var(--fg-faint)}
.track{display:flex;align-items:center;min-width:0}
.bar{display:flex;gap:2px;height:15px;min-width:0;flex:none}
.seg{height:100%;min-width:2px}
.seg:last-child{border-radius:0 4px 4px 0}
.rval{font-size:11px;color:var(--fg-dim);text-align:right;font-family:Consolas,monospace;white-space:nowrap}
.rval.hi{color:var(--fg);font-weight:600}
.axis{position:relative;height:20px;margin-top:8px;border-top:1px solid var(--axis)}
.axis span{
  position:absolute;top:4px;transform:translateX(-50%);font-size:10px;
  color:var(--fg-faint);font-family:Consolas,monospace;white-space:nowrap;
}
.axis span.first{transform:none} .axis span.last{transform:translateX(-100%)}
.thresh{position:absolute;top:0;bottom:0;width:1px;background:var(--warn);opacity:.7}
.thresh::after{
  content:attr(data-label);position:absolute;top:-13px;left:3px;
  font-size:9.5px;color:var(--warn);white-space:nowrap;font-family:Consolas,monospace;
}

/* ═══ SVG CHARTS ═════════════════════════════════════════════════════ */
.svgwrap{width:100%;overflow-x:auto}
svg.chart{display:block;max-width:100%;height:auto;overflow:visible}
svg.chart .gl{stroke:var(--grid);stroke-width:1}
svg.chart .ax{stroke:var(--axis);stroke-width:1}
svg.chart .tick{fill:var(--fg-faint);font-size:10px;font-family:Consolas,monospace}
svg.chart .area{opacity:.12}
svg.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.chart .dot{stroke:var(--d2);stroke-width:2}
svg.chart .hair{stroke:var(--fg-faint);stroke-width:1;stroke-dasharray:none;opacity:.55}

/* ═══ HEATMAP ════════════════════════════════════════════════════════ */
.hm{display:grid;gap:2px;min-width:0}
.hm .cell{
  height:24px;border-radius:3px;display:grid;place-items:center;
  font-size:9.5px;font-family:Consolas,monospace;cursor:default;
}
.hm .hlab{
  font-size:10px;font-family:Consolas,monospace;color:var(--fg-dim);
  display:flex;align-items:center;justify-content:flex-end;padding-right:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hm .clab{
  font-size:9.5px;font-family:Consolas,monospace;color:var(--fg-faint);
  writing-mode:vertical-rl;transform:rotate(180deg);
  height:118px;display:flex;align-items:flex-end;justify-content:center;
  white-space:nowrap;overflow:hidden;
}
.rampkey{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--fg-muted);margin-top:10px}
.rampkey .steps{display:flex;gap:2px}
.rampkey .steps i{width:20px;height:9px;border-radius:2px;display:block}

/* ═══ GANTT ══════════════════════════════════════════════════════════ */
.gantt{display:flex;flex-direction:column;gap:3px}
.gantt .grow{display:grid;grid-template-columns:210px 1fr 74px;gap:10px;align-items:center;min-height:22px;border-radius:5px}
.gantt .grow:hover{background:var(--hover-bg)}
.gantt .gtrack{position:relative;height:15px;background:var(--d3);border-radius:3px;overflow:hidden}
.gantt .gbar{position:absolute;top:0;bottom:0;border-radius:3px;min-width:2px}

/* ═══ TABLES ═════════════════════════════════════════════════════════ */
.tblwrap{overflow-x:auto;margin:0 -2px;padding:0 2px}
table.tbl{border-collapse:collapse;width:100%;font-size:12px;min-width:640px}
.tbl th{
  text-align:left;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--fg-faint);padding:0 10px 8px 0;border-bottom:1px solid var(--axis);white-space:nowrap;
}
.tbl td{padding:7px 10px 7px 0;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl tbody tr:hover{background:var(--hover-bg)}
.tbl tbody tr.clickable{cursor:pointer}
.tbl .num{text-align:right;font-family:Consolas,monospace;font-variant-numeric:tabular-nums}
.tbl .mn{font-family:Consolas,monospace;font-size:11px}
.tbl tfoot td{border-bottom:none;border-top:1px solid var(--axis);font-weight:600;padding-top:9px}
.dash{color:var(--fg-faint)}

/* ═══ PILLS / ALERTS ═════════════════════════════════════════════════ */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;
  padding:2px 8px 2px 5px;border-radius:99px;white-space:nowrap;
  background:var(--d3);border:1px solid var(--wb);color:var(--fg-dim);
}
.pill .ic{width:12px;height:12px;border-radius:3px;display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;line-height:1;flex:none}
.ic.ok{background:var(--ok)} .ic.warn{background:var(--warn);color:#3a2600}
.ic.bad{background:var(--bad)} .ic.mute{background:var(--g2)}
.ic.live{background:var(--r);animation:pulse 1.6s ease-in-out infinite}
.pill.p-live{border-color:var(--r);color:var(--r)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.livebar{
  display:flex;align-items:center;gap:9px;padding:9px 14px;margin-bottom:14px;
  border-radius:var(--rad2);background:var(--rb);border:1px solid var(--r);
  font-size:12.5px;color:var(--fg);
}
.livebar .dot{width:9px;height:9px;border-radius:50%;background:var(--r);
  animation:pulse 1.6s ease-in-out infinite;flex:none}
.livebar .names{font-family:Consolas,monospace;font-size:11.5px;color:var(--fg-dim)}
.livebar .next{margin-left:auto;font-size:11px;color:var(--fg-muted);white-space:nowrap}
.tm-live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--r);font-weight:600}
.tm-live .dot{width:8px;height:8px;border-radius:50%;background:var(--r);
  animation:pulse 1.6s ease-in-out infinite}
.chg{border-left-color:var(--r)!important}
.alist{display:flex;flex-direction:column;gap:8px}
.alert{
  display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:var(--rad);
  background:var(--d3);border:1px solid var(--wb);border-left:3px solid var(--g2);font-size:12.5px;
}
.alert.a-warn{border-left-color:var(--warn);background:var(--warn-bg)}
.alert.a-bad{border-left-color:var(--bad);background:var(--bad-bg)}
.alert.a-ok{border-left-color:var(--ok);background:var(--ok-bg)}
.alert.a-info{border-left-color:var(--info)}
.alert .atx{min-width:0}
.alert b{font-weight:600}
.alert .ameta{display:block;font-size:11px;color:var(--fg-muted);margin-top:2px}
.empty{font-size:12px;color:var(--fg-faint);padding:8px 0}

/* ═══ INSIGHTS ═══════════════════════════════════════════════════════ */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.ins{background:var(--d3);border:1px solid var(--wb);border-radius:var(--rad);padding:12px 14px}
.ins .it{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--r);margin:0 0 5px}
.ins .iv{font-size:14px;font-weight:600;margin:0 0 3px;line-height:1.3}
.ins .id{font-size:11.5px;color:var(--fg-muted);margin:0;line-height:1.4}

/* ═══ MODEL COST TAB ═════════════════════════════════════════════════ */
.banner{
  display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:var(--rad2);
  background:var(--warn-bg);border:1px solid var(--wb);border-left:3px solid var(--warn);
  font-size:12.5px;margin-bottom:14px;
}
.banner p{margin:0 0 5px} .banner p:last-child{margin:0}
.mtbl input[type="number"]{width:96px}
.mtbl td{vertical-align:middle}
.badge{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--rb);color:var(--r);white-space:nowrap}
.badge.mute{background:var(--d4);color:var(--fg-faint)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}

/* ═══ TOOLTIP ════════════════════════════════════════════════════════ */
#tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  background:var(--d2);border:1px solid var(--wb2);border-radius:var(--rad);
  box-shadow:0 4px 20px -6px rgba(0,0,0,.4);padding:8px 11px;min-width:150px;max-width:320px;
  transition:opacity .1s;
}
#tip .tt{font-size:10.5px;color:var(--fg-muted);margin-bottom:5px;font-family:Consolas,monospace;overflow-wrap:anywhere}
#tip .tr{display:flex;align-items:center;gap:7px;font-size:11.5px;margin-top:2px}
#tip .tk{width:11px;height:2px;border-radius:1px;flex:none}
#tip .tn{color:var(--fg-dim)}
#tip .tv{margin-left:auto;font-weight:600;font-family:Consolas,monospace;color:var(--fg)}

@media (max-width:820px){
  .page{padding:16px 14px 56px}
  .topbar,.tabstrip,.filterbar{padding-left:14px;padding-right:14px}
  .row{grid-template-columns:1fr auto;gap:2px 8px}
  .row .rlab{grid-column:1/-1}
  .gridlines{display:none}
  .gantt .grow{grid-template-columns:1fr}

/* t("chave", {var:valor}) - cai para `en` e depois para a propria chave,
   de modo que uma traducao faltando nunca apaga um rotulo da tela. */
function t(key, vars){
  let out = I18N[LANG][key];
  if(out===undefined) out = I18N.en[key];
  if(out===undefined) return key;
  if(vars) for(const k in vars) out = out.split("{"+k+"}").join(vars[k]);
  return out;
}
const LOC = () => LANG==="pt" ? "pt-BR" : "en-US";
const CUR = () => t("cur.symbol");

/* ═══════════════════ helpers ═══════════════════ */
const nf   = n => Math.round(n).toLocaleString(LOC());
const nf1  = n => n.toLocaleString(LOC(),{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2  = n => n.toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2});
const usd  = v => CUR() + nf2(v);
const usd0 = v => CUR() + nf(v);
const pct  = v => nf1(v) + "%";
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function hms(s){ s=Math.round(s);
  return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function dur(s){ s=Math.round(s);
  if(!s) return "0s";
  if(s<60) return s+"s";
  const m=Math.floor(s/60); if(m<60) return (s%60)? m+"m "+(s%60)+"s" : m+"m";
  return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"; }
function compact(n){
  if(!n) return "0";
  if(n>=1e9) return nf2(n/1e9)+" B";
  if(n>=1e6) return nf2(n/1e6)+" M";
  if(n>=1e3) return nf(n/1e3)+" k";
  return nf(n); }
function el(t,c,x){ const n=document.createElement(t); if(c) n.className=c; if(x!==undefined) n.textContent=x; return n; }
function frag(){ return document.createDocumentFragment(); }
function dmy(iso){ const [y,m,d]=iso.slice(0,10).split("-");
  return LANG==="pt" ? d+"/"+m : m+"/"+d; }
function ts(v){ return v ? v.replace("T"," ").replace("Z","") : "—"; }

const TIME_STEPS=[10,15,30,60,120,300,600,900,1800,3600,7200,10800,21600,43200,86400,172800];
function ticks(v,kind){
  const raw=Math.max(v,1e-9)/5; let step;
  if(kind==="time"){ step=TIME_STEPS.find(s=>s>=raw)||Math.ceil(raw/86400)*86400; }
  else{ const e=Math.pow(10,Math.floor(Math.log10(Math.max(raw,1e-9))));
        step=[1,2,2.5,5,10].map(m=>m*e).find(s=>s>=raw)||10*e;
        if(kind==="count") step=Math.max(1,Math.round(step)); }
  const max=Math.max(Math.ceil(Math.max(v,1e-9)/step)*step,step), list=[];
  for(let v=0;v<=max+1e-9;v+=step) list.push(v);
  return {max,list}; }

/* Tarifa vem do metrics.yaml (settings.token_cost) — não do navegador. */
function rates(){
  const c=(DATA.settings||{}).token_cost||{};
  return {i:Number(c.input_per_million)||0, o:Number(c.output_per_million)||0};
}
const cost = (i,o,ri,ro) => {
  const r=rates();
  return i*(ri===undefined?r.i:ri)/1e6 + o*(ro===undefined?r.o:ro)/1e6;
};
const runCost = r => cost(r.tin,r.tout);

/* O servidor já devolve apenas os runs do filtro corrente. */

/* ── KPI vindo do metrics.yaml ────────────────────────────────────── */
function M(id){ return METRICS[id]; }
/* O metrics.yaml e a fonte da metrica, nao do idioma: o nome exibido vem
   do dicionario quando ha traducao para o id, senao cai no `name` do YAML. */
function mName(m){ const k="m."+m.id; const v=t(k); return v===k ? m.name : v; }
function fmtMetric(m){
  if(!m || !m.available || m.value===null || m.value===undefined) return t("na");
  const v=m.value, f=m.format;
  if(f==="integer")    return nf(v);
  if(f==="decimal")    return nf2(v);
  if(f==="percentage") return pct(v);
  if(f==="currency")   return usd(v);
  if(f==="duration")   return hms(v);
  if(f==="breakdown" && v && typeof v==="object")
    return Object.keys(v).map(k=>k+": "+v[k]).join(" · ");
  return String(v);
}
/* [rótulo, valor, sublinha, realce] — o rótulo é o `name` do metrics.yaml */
function kpiM(id, sub, cls){
  const m=M(id);
  if(!m) return [id, "—", t("metric.unset"), "mute"];
  return [mName(m), fmtMetric(m),
          sub!==undefined ? sub : (m.description||""),
          m.available ? (cls||null) : "mute"];
}

/* agregações reutilizadas */
function byPhase(runs,keyFn){
  const m=new Map();
  runs.forEach(r=>r.phases.forEach(p=>{
    const k=keyFn(p.phase_name);
    let o=m.get(k); if(!o){ o={key:k,time:0,tin:0,tout:0,n:0,deg:0,noTel:0,runs:new Set(),durs:[]}; m.set(k,o); }
    o.time+=p.duration_seconds; o.tin+=p.token_usage.token_in; o.tout+=p.token_usage.token_out;
    o.n++; o.runs.add(r.id); if(p.status==="degraded") o.deg++; if(noTel(p)) o.noTel++;
    if(p.duration_seconds>0) o.durs.push(p.duration_seconds);
  }));
  return [...m.values()].map(o=>Object.assign(o,{tokens:o.tin+o.tout,cost:cost(o.tin,o.tout)}));
}
function byProject(runs){
  const m=new Map();
  runs.forEach(r=>{ let o=m.get(r.project);
    if(!o){ o={key:r.project,time:0,wall:0,tin:0,tout:0,n:0,deg:0,runs:[]}; m.set(r.project,o); }
    o.time+=r.effective; o.wall+=r.wall; o.tin+=r.tin; o.tout+=r.tout; o.n++; o.deg+=r.nDeg; o.runs.push(r); });
  return [...m.values()].map(o=>Object.assign(o,{tokens:o.tin+o.tout,cost:cost(o.tin,o.tout)}));
}
function byDay(runs){
  const m=new Map();
  runs.forEach(r=>{ let o=m.get(r.date);
    if(!o){ o={key:r.date,n:0,tin:0,tout:0,time:0}; m.set(r.date,o); }
    o.n++; o.tin+=r.tin; o.tout+=r.tout; o.time+=r.effective; });
  return [...m.values()].sort((a,b)=>a.key<b.key?-1:1)
    .map(o=>Object.assign(o,{tokens:o.tin+o.tout,cost:cost(o.tin,o.tout)}));
}

/* ═══════════════════ tooltip ═══════════════════ */
const tip=document.getElementById("tip");
function showTip(ev,title,rows){
  tip.replaceChildren();
  if(title) tip.appendChild(el("div","tt",title));
  rows.forEach(r=>{
    const n=el("div","tr"); const k=el("span","tk"); k.style.background=r.color||"transparent";
    n.appendChild(k); n.appendChild(el("span","tn",r.name)); n.appendChild(el("span","tv",r.value)); tip.appendChild(n);
  });
  tip.style.opacity="1"; moveTip(ev);
}
function moveTip(ev){
  const h=ev.currentTarget||ev.target, b=h.getBoundingClientRect();
  const x=(ev.clientX&&ev.clientX>0)?ev.clientX:b.left+b.width/2;
  tip.style.left=Math.min(Math.max(x,120),window.innerWidth-120)+"px";
  tip.style.top=Math.max(b.top-8,90)+"px";
}
function hideTip(){ tip.style.opacity="0"; }
function bindTip(node,title,rows){
  node.tabIndex=0;
  node.addEventListener("pointerenter",e=>showTip(e,title,typeof rows==="function"?rows():rows));
  node.addEventListener("pointermove",moveTip);
  node.addEventListener("pointerleave",hideTip);
  node.addEventListener("focus",e=>showTip(e,title,typeof rows==="function"?rows():rows));
  node.addEventListener("blur",hideTip);
}

/* ═══════════════════ gráfico de barras horizontais ═══════════════════ */
function hbars(items,opts){
  const o=Object.assign({labelWidth:150,valueWidth:80,fmt:nf,kind:null,threshold:null,onClick:null},opts);
  const totals=items.map(i=>i.segs.reduce((a,s)=>a+s.v,0));
  const sc=ticks(Math.max.apply(null,totals.concat([1e-9])),o.kind);
  const peak=Math.max.apply(null,totals);
  const labelAll=items.length<=6;

  const plot=el("div","plot");
  plot.style.setProperty("--labw",o.labelWidth+"px");
  plot.style.setProperty("--valw",o.valueWidth+"px");
  const grid=el("div","gridlines");
  grid.style.left="calc("+o.labelWidth+"px + 12px)";
  grid.style.right="calc("+o.valueWidth+"px + 12px)";
  sc.list.forEach((t,i)=>{ const g=el("span",i===0?"zero":""); g.style.left=(t/sc.max*100)+"%"; grid.appendChild(g); });
  if(o.threshold!==null && o.threshold<=sc.max){
    const th=el("div","thresh"); th.style.left=(o.threshold/sc.max*100)+"%";
    th.setAttribute("data-label",o.thresholdLabel||""); grid.appendChild(th);
  }

  const rows=el("div","rows");
  items.forEach((it,idx)=>{
    const total=totals[idx];
    const row=el("div","row"+(o.onClick?" clickable":""));
    const lab=el("div","rlab"); lab.appendChild(document.createTextNode(it.label));
    if(it.flag) lab.appendChild(el("span","flag",it.flag));
    row.appendChild(lab);

    const track=el("div","track");
    const drawn=it.segs.filter(s=>s.v>0);
    if(drawn.length){
      const bar=el("div","bar"); bar.style.width=(total/sc.max*100)+"%";
      drawn.forEach(s=>{ const g=el("div","seg"); g.style.background=s.color; g.style.flex=s.v+" 1 0"; bar.appendChild(g); });
      track.appendChild(bar);
    } else track.appendChild(el("span","rval","—"));
    row.appendChild(track);

    const val=el("div","rval"+(total===peak?" hi":""));
    if(drawn.length && (labelAll||total===peak||it.forceLabel)) val.textContent=o.fmt(total);
    row.appendChild(val);

    bindTip(row,it.label,it.tipRows||it.segs.map(s=>({color:s.color,name:s.name,value:o.fmt(s.v)})));
    if(o.onClick){ row.addEventListener("click",()=>o.onClick(it));
      row.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();o.onClick(it);} }); }
    rows.appendChild(row);
  });

  plot.appendChild(grid); plot.appendChild(rows);
  const axis=el("div","axis");
  axis.style.marginLeft="calc("+o.labelWidth+"px + 12px)";
  axis.style.marginRight="calc("+o.valueWidth+"px + 12px)";
  sc.list.forEach((t,i)=>{
    const s=el("span",i===0?"first":(i===sc.list.length-1?"last":""),o.axisFmt?o.axisFmt(t):compact(t));
    s.style.left=(t/sc.max*100)+"%"; axis.appendChild(s);
  });
  const box=el("div"); box.appendChild(plot); box.appendChild(axis); return box;
}

/* ═══════════════════ gráfico de linha / área ═══════════════════ */
/* Desenha 1 unidade SVG = 1 pixel, medindo o container. Sem isso o viewBox
   fixo esticaria horizontalmente e deformaria os rótulos dos eixos. */
function trend(xLabels,series,opts){
  const o=Object.assign({fmt:compact,kind:null,height:190,area:true},opts);
  const wrap=el("div","svgwrap");
  const draw=w=>{ wrap.replaceChildren(drawTrend(Math.max(w||760,320),xLabels,series,o)); };
  if(typeof ResizeObserver==="function"){
    let last=0;
    new ResizeObserver(es=>{
      const w=Math.round(es[0].contentRect.width);
      if(w && Math.abs(w-last)>1){ last=w; draw(w); }
    }).observe(wrap);
  }
  draw(760);
  return wrap;
}
function drawTrend(W,xLabels,series,o){
  const H=o.height,PL=52,PR=16,PT=12,PB=26;
  const maxV=Math.max.apply(null,series.flatMap(s=>s.points).concat([1e-9]));
  const sc=ticks(maxV,o.kind);
  const n=xLabels.length;
  const X=i=> n<=1 ? PL+(W-PL-PR)/2 : PL+(W-PL-PR)*i/(n-1);
  const Y=v=> H-PB-(H-PB-PT)*(v/sc.max);

  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","chart"); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("role","img");
  const mk=(t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };

  sc.list.forEach(t=>{
    svg.appendChild(mk("line",{class:"gl",x1:PL,x2:W-PR,y1:Y(t),y2:Y(t)}));
    const lb=mk("text",{class:"tick",x:PL-7,y:Y(t)+3.5,"text-anchor":"end"});
    lb.textContent=o.fmt(t); svg.appendChild(lb);
  });
  svg.appendChild(mk("line",{class:"ax",x1:PL,x2:W-PR,y1:Y(0),y2:Y(0)}));

  xLabels.forEach((lb,i)=>{
    const t=mk("text",{class:"tick",x:X(i),y:H-8,"text-anchor":"middle"});
    t.textContent=lb; svg.appendChild(t);
  });

  series.forEach(s=>{
    const pts=s.points.map((v,i)=>X(i)+","+Y(v)).join(" ");
    if(o.area && series.length===1){
      svg.appendChild(mk("polygon",{class:"area",fill:s.color,
        points:X(0)+","+Y(0)+" "+pts+" "+X(n-1)+","+Y(0)}));
    }
    svg.appendChild(mk("polyline",{class:"ln",stroke:s.color,points:pts}));
    s.points.forEach((v,i)=> svg.appendChild(mk("circle",{class:"dot",cx:X(i),cy:Y(v),r:4,fill:s.color})));
  });

  const hair=mk("line",{class:"hair",x1:0,x2:0,y1:PT,y2:H-PB,opacity:0}); svg.appendChild(hair);
  xLabels.forEach((lb,i)=>{
    const hw=(W-PL-PR)/Math.max(n,1);
    const hit=mk("rect",{x:X(i)-hw/2,y:PT,width:hw,height:H-PB-PT,fill:"transparent"});
    hit.style.cursor="crosshair";
    const rows=()=>series.map(s=>({color:s.color,name:s.name,value:o.fmt(s.points[i])}));
    hit.addEventListener("pointerenter",e=>{ hair.setAttribute("x1",X(i)); hair.setAttribute("x2",X(i));
      hair.setAttribute("opacity",1); showTip(e,o.titles?o.titles[i]:lb,rows()); });
    hit.addEventListener("pointermove",moveTip);
    hit.addEventListener("pointerleave",()=>{ hair.setAttribute("opacity",0); hideTip(); });
    svg.appendChild(hit);
  });

  return svg;
}

/* ═══════════════════ donut ═══════════════════ */
function donut(items,centerLabel,centerValue){
  const NS="http://www.w3.org/2000/svg", S=200, R=76, IR=50, C=S/2;
  const tot=items.reduce((a,i)=>a+i.value,0)||1;
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","chart"); svg.setAttribute("viewBox","0 0 "+S+" "+S);
  svg.style.maxWidth="220px"; svg.style.margin="0 auto";
  const mk=(t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
  let ang=-Math.PI/2;
  items.forEach(it=>{
    if(it.value<=0) return;
    const sweep=it.value/tot*Math.PI*2, gap=items.filter(x=>x.value>0).length>1?0.018:0;
    const a0=ang+gap/2, a1=ang+sweep-gap/2; ang+=sweep;
    const pt=(r,a)=>[C+r*Math.cos(a),C+r*Math.sin(a)];
    const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(IR,a1),[x3,y3]=pt(IR,a0);
    const big=(a1-a0)>Math.PI?1:0;
    const p=mk("path",{fill:it.color,d:["M",x0,y0,"A",R,R,0,big,1,x1,y1,"L",x2,y2,"A",IR,IR,0,big,0,x3,y3,"Z"].join(" ")});
    bindTip(p,it.label,[{color:it.color,name:t("tip.executions"),value:nf(it.value)},
                        {color:"transparent",name:t("tip.share"),value:pct(it.value/tot*100)}]);
    svg.appendChild(p);
  });
  const t1=mk("text",{x:C,y:C-2,"text-anchor":"middle"});
  t1.setAttribute("style","font-size:26px;font-weight:600;fill:var(--fg)"); t1.textContent=centerValue;
  const t2=mk("text",{x:C,y:C+15,"text-anchor":"middle"});
  t2.setAttribute("style","font-size:10px;fill:var(--fg-muted)"); t2.textContent=centerLabel;
  svg.appendChild(t1); svg.appendChild(t2);
  const wrap=el("div"); wrap.appendChild(svg); return wrap;
}

/* ═══════════════════ heatmap ═══════════════════ */
const RAMP=["--q0","--q1","--q2","--q3","--q4","--q5"];
function rampColor(v,max){
  if(v<=0) return cssv("--d3");
  const i=Math.min(RAMP.length-1,1+Math.floor(v/max*(RAMP.length-1.001)));
  return cssv(RAMP[i]);
}
function heatmap(rowKeys,colRuns,valueOf,fmt){
  const wrap=el("div"); const box=el("div","svgwrap"); const g=el("div","hm");
  g.style.gridTemplateColumns="132px repeat("+colRuns.length+",minmax(30px,1fr))";
  g.style.minWidth=(132+colRuns.length*34)+"px";
  g.appendChild(el("div"));
  colRuns.forEach(r=>{ const c=el("div","clab",r.project.slice(0,26)); g.appendChild(c); });
  let max=0;
  rowKeys.forEach(k=>colRuns.forEach(r=>{ max=Math.max(max,valueOf(k,r)); }));
  rowKeys.forEach(k=>{
    g.appendChild(el("div","hlab",k));
    colRuns.forEach(r=>{
      const v=valueOf(k,r), c=el("div","cell");
      c.style.background=rampColor(v,max);
      if(v>0){ const rel=v/max; c.style.color = rel>0.55 ? "#fff" : "var(--fg-dim)"; c.textContent=fmt(v); }
      bindTip(c,k+" · "+r.project,[
        {color:cssv("--s1"),name:t("tip.value"),value:v>0?fmt(v):t("tip.unmeasured")},
        {color:"transparent",name:t("tip.execution"),value:r.id}]);
      g.appendChild(c);
    });
  });
  box.appendChild(g); wrap.appendChild(box);
  const key=el("div","rampkey"); key.appendChild(el("span","","0"));
  const steps=el("div","steps");
  RAMP.forEach(v=>{ const i=el("i"); i.style.background=cssv(v); steps.appendChild(i); });
  key.appendChild(steps); key.appendChild(el("span","",fmt(max)));
  wrap.appendChild(key); return wrap;
}

/* ═══════════════════ componentes ═══════════════════ */
function kpi(label,value,sub,cls){

function kpiRow(list){ const g=el("div","kpis"); list.forEach(a=>g.appendChild(kpi.apply(null,a))); return g; }
function card(title,sub,legendItems,cls){
  const c=el("section","card"+(cls?" "+cls:""));
  const h=el("div","card-head"); h.appendChild(el("h2","",title));
  if(legendItems){

function table(headers,rowsData,footer,onRowClick){
  const w=el("div","tblwrap"), t=el("table","tbl"), th=el("thead"), hr=el("tr");
  headers.forEach(h=>{ const c=el("th","",typeof h==="string"?h:h.t);
    if(typeof h!=="string"&&h.num) c.style.textAlign="right"; hr.appendChild(c); });
  th.appendChild(hr); t.appendChild(th);
  const tb=el("tbody");
  rowsData.forEach(r=>{
    const tr=el("tr"+(onRowClick?"":""),onRowClick?"clickable":"");
    r.cells.forEach(c=>{
      const td=el("td",c.cls||"");
      if(c.node) td.appendChild(c.node); else td.appendChild(document.createTextNode(c.v));
      tr.appendChild(td);
    });
    if(onRowClick){ tr.tabIndex=0; tr.addEventListener("click",()=>onRowClick(r.ref));
      tr.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();onRowClick(r.ref);} }); }
    tb.appendChild(tr);

  t.appendChild(tb);

    footer.forEach(c=>{ const td=el("td",c.cls||""); td.textContent=c.v; fr.appendChild(td); });

  const cD=card(t("pf.dist"), t("pf.dists"));
  cD.appendChild(strip(ph.filter(p=>p.durs.length).sort((a,b)=>b.time-a.time).slice(0,12)));
  g2.appendChild(cD);
  f.appendChild(g2);
  return f;
}

function gantt(run){
  const withT=run.phases.filter(p=>p.start_time_utc&&p.end_time_utc);
  if(!withT.length) return el("p","empty",t("pf.noTimes"));
  const t0=Math.min.apply(null,withT.map(p=>Date.parse(p.start_time_utc)));
  const t1=Math.max.apply(null,withT.map(p=>Date.parse(p.end_time_utc)));
  const span=Math.max(t1-t0,1);
  const box=el("div","gantt");
  run.phases.forEach(p=>{
    const row=el("div","grow");
    const lab=el("div","rlab",p.phase_name); row.appendChild(lab);
    const tr=el("div","gtrack");
    if(p.start_time_utc&&p.end_time_utc){
      const a=Date.parse(p.start_time_utc), b=Date.parse(p.end_time_utc);
      const bar=el("div","gbar");
      bar.style.left=((a-t0)/span*100)+"%";
      bar.style.width=Math.max((b-a)/span*100,0.4)+"%";
      bar.style.background=p.status==="degraded"?cssv("--warn"):p.status==="aborted"?cssv("--bad"):S1();
      tr.appendChild(bar);
    }
    row.appendChild(tr);
    const v=el("div","rval",p.duration_seconds?dur(p.duration_seconds):"—"); row.appendChild(v);
    bindTip(row,p.phase_name,[
      {color:S1(),name:t("tip.duration"),value:p.duration_seconds?hms(p.duration_seconds):t("tip.unmeasured")},
      {color:"transparent",name:t("tip.start"),value:ts(p.start_time_utc)},
      {color:"transparent",name:t("tip.end"),value:ts(p.end_time_utc)},
      {color:"transparent",name:t("tip.tokens"),value:compact(p.token_usage.total_tokens)},
      {color:"transparent",name:t("tip.state"),value:stLabel(p.status)}]);
    box.appendChild(row);
  });
  return box;
}

function strip(phases){
  const max=Math.max.apply(null,phases.flatMap(p=>p.durs).concat([1]));
  const sc=ticks(max,"time");
  const wrap=el("div"), plot=el("div","plot");
  plot.style.setProperty("--labw","64px"); plot.style.setProperty("--valw","78px");
  const grid=el("div","gridlines");
  grid.style.left="calc(64px + 12px)"; grid.style.right="calc(78px + 12px)";
  sc.list.forEach((t,i)=>{ const g=el("span",i===0?"zero":""); g.style.left=(t/sc.max*100)+"%"; grid.appendChild(g); });
  const rows=el("div","rows");
  phases.forEach(p=>{
    const sorted=[...p.durs].sort((a,b)=>a-b);
    const med=sorted.length%2 ? sorted[(sorted.length-1)/2] : (sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
    const row=el("div","row");
    row.appendChild(el("div","rlab",p.key));
    const tr=el("div","track"); tr.style.position="relative"; tr.style.height="18px";
    p.durs.forEach(d=>{
      const dot=el("span"); dot.style.cssText="position:absolute;width:9px;height:9px;border-radius:50%;"+
        "background:"+S2()+";border:2px solid var(--d2);top:4px;transform:translateX(-50%);";
      dot.style.left=(d/sc.max*100)+"%"; tr.appendChild(dot);
    });
    const m=el("span"); m.style.cssText="position:absolute;width:2px;height:16px;background:var(--fg-dim);top:1px;transform:translateX(-50%);";
    m.style.left=(med/sc.max*100)+"%"; tr.appendChild(m);
    row.appendChild(tr);
    row.appendChild(el("div","rval",dur(med)));
    bindTip(row,p.key,[{color:S2(),name:t("tip.median"),value:hms(med)},
      {color:"transparent",name:t("tip.minMax"),value:dur(sorted[0])+" / "+dur(sorted[sorted.length-1])},
      {color:"transparent",name:t("tip.samples"),value:nf(p.durs.length)}]);
    rows.appendChild(row);
  });
  plot.appendChild(grid); plot.appendChild(rows);
  const axis=el("div","axis");
  axis.style.marginLeft="calc(64px + 12px)"; axis.style.marginRight="calc(78px + 12px)";
  sc.list.forEach((t,i)=>{ const s=el("span",i===0?"first":(i===sc.list.length-1?"last":""),dur(t));
    s.style.left=(t/sc.max*100)+"%"; axis.appendChild(s); });
  wrap.appendChild(plot); wrap.appendChild(axis); return wrap;
}

/* ═══════════════════ PÁGINA 4 — FINOPS ═══════════════════ */
function pageFinops(){
  const f=frag(), runs=scope();
  f.appendChild(pageHead(t("fin.title"), t("fin.desc")));
  if(!runs.length){ f.appendChild(el("p","empty",t("empty.runs"))); return f; }

  const tin=sum(runs,r=>r.tin), tout=sum(runs,r=>r.tout);
  const total=cost(tin,tout), eff=sum(runs,r=>r.effective);
  const projs=byProject(runs).sort((a,b)=>b.cost-a.cost);
  const ph=byPhase(runs,canon).sort((a,b)=>b.cost-a.cost);
  const avgRun=total/runs.length, avgPhase=ph.length?total/ph.length:0;

  f.appendChild(kpiRow([
    kpiM("portfolio_total_cost", t("fin.sub.tokens",{n:nf(tin+tout)}), "ok"),
    kpiM("average_cost_per_execution", t("fin.sub.runs",{n:runs.length})),

    kpiM("cost_per_project", t("fin.sub.projects",{n:projs.length})),
    [t("fin.k5"), usd(avgPhase), t("fin.k5s",{n:ph.length})],
    [t("fin.k6"), usd(cost(tin,0)),
     total?t("fin.sub.pct",{p:pct(cost(tin,0)/total*100)}):"—"],
    [t("fin.k7"), usd(cost(0,tout)),

    label:p.key, segs:[{v:cost(p.tin,0),color:S2(),name:t("tip.input")},{v:cost(0,p.tout),color:S1(),name:t("tip.output")}],
    tipRows:[{color:S2(),name:t("tip.inputCost"),value:usd(cost(p.tin,0))},
             {color:S1(),name:t("tip.outputCost"),value:usd(cost(0,p.tout))},
             {color:"transparent",name:t("tip.total"),value:usd(p.cost)},
             {color:"transparent",name:t("tip.executions"),value:nf(p.n)}],
    ref:p.key
  })),{labelWidth:190,valueWidth:82,fmt:usd,axisFmt:usd0,
       onClick:it=>{ state.projects=new Set([it.ref]); renderFilters(); render(); }}));
  g1.appendChild(c1);

  const c2=card(t("fin.c2"),t("fin.c2s"));
  c2.appendChild(hbars(ph.map(p=>({
    label:p.key, segs:[{v:p.cost,color:S1(),name:t("tip.cost")}],
    tipRows:[{color:S1(),name:t("tip.cost"),value:usd(p.cost)},
             {color:"transparent",name:t("tip.pctTotal"),value:pct(p.cost/total*100)},
             {color:"transparent",name:t("tip.tokens"),value:nf(p.tokens)}]
  })),{labelWidth:64,valueWidth:82,fmt:usd,axisFmt:usd0,
       threshold:total*0.2,thresholdLabel:t("thresh.20cost")}));
  g1.appendChild(c2);
  f.appendChild(g1);

  const g2=el("div","grid g2");
  const days=byDay(runs);
  const c3=card(t("fin.c3"),t("fin.c3s"));
  c3.appendChild(trend(days.map(d=>dmy(d.key)),[{name:t("tip.cost"),color:S3(),points:days.map(d=>d.cost)}],
    {fmt:usd,titles:days.map(d=>d.key)}));
  g2.appendChild(c3);

  let cum=0; const cumPts=days.map(d=>{ cum+=d.cost; return cum; });
  const c4=card(t("fin.c4"),t("fin.c4s"));
  c4.appendChild(trend(days.map(d=>dmy(d.key)),[{name:t("tip.cumulative"),color:S1(),points:cumPts}],
    {fmt:usd,titles:days.map(d=>d.key)}));
  g2.appendChild(c4);
  f.appendChild(g2);

  const top=[...runs].sort((a,b)=>runCost(b)-runCost(a)).slice(0,10);
  const cT=card(t("fin.table"),null);
  cT.appendChild(table(
    [t("col.project"),t("col.execution"),t("col.date"),t("col.status"),
     {t:t("col.tokens"),num:1},{t:t("col.estCost"),num:1},{t:t("col.vsAvg"),num:1}],

        {v:r.project,cls:"mn"},{v:r.id,cls:"mn"},{v:r.date,cls:"mn"},{node:pill(r.status)},

    }),null,r=>{ state.drill=r.id; state.tab=1; render(); }));
  f.appendChild(cT);

  f.appendChild(buildAlerts(runs,true));
  return f;
}

/* ═══════════════════ PÁGINA 5 — QUALITY & OPERATIONS ═══════════════════ */
function pageQuality(){
  const f=frag(), runs=scope();
  f.appendChild(pageHead(t("page.qual"), t("ql.desc")));
  if(!runs.length){ f.appendChild(el("p","empty",t("empty.runs"))); return f; }

  const ok=runs.filter(r=>r.status==="completed").length;
  const warn=runs.filter(r=>r.status==="completed_with_warnings").length;
  const bad=runs.filter(r=>r.status==="aborted").length;
  const allPh=runs.flatMap(r=>r.phases);
  const deg=allPh.filter(p=>p.status==="degraded").length;
  const abt=allPh.filter(p=>p.status==="aborted").length;
  const skp=allPh.filter(p=>p.status==="skipped").length;
  const health = runs.map(r=>r.phases.filter(p=>p.status==="executed").length/r.phases.length*100);
  const avgHealth = health.reduce((a,b)=>a+b,0)/health.length;

  f.appendChild(kpiRow([
    kpiM("success_rate", t("ql.sub.ok",{ok:ok,n:runs.length}), "ok"),
    kpiM("warning_rate", t("ql.sub.warn",{n:warn}), "warn"),
    kpiM("failure_rate", t("ql.sub.bad",{n:bad}), bad?"bad":"ok"),
    kpiM("portfolio_degraded_phases", t("ql.sub.ofPhases",{n:allPh.length}), "warn"),
    kpiM("portfolio_weighted_health", t("ql.sub.weighted"), "ok"),
    kpiM("phase_degraded_rate", t("ql.sub.degRate")),
    [t("ql.k7"), pct(allPh.length?abt/allPh.length*100:0), t("ql.k7s",{n:abt})],
    [t("ql.k8"), pct(avgHealth), t("ql.k8s"), avgHealth>=90?"ok":"warn"]
  ]));

  const g1=el("div","grid g2");
  const ph=byPhase(runs,canon).sort((a,b)=>b.n-a.n);
  const c1=card(t("ql.c1"),t("ql.c1s"),
    [{name:stLabel("executed"),color:cssv("--ok"),glyph:"✓",cls:"ok"},
     {name:stLabel("degraded"),color:cssv("--warn"),glyph:"!",cls:"warn"},
     {name:stLabel("aborted"),color:cssv("--bad"),glyph:"×",cls:"bad"},
     {name:stLabel("skipped"),color:cssv("--g2"),glyph:"–",cls:"mute"}]);
  const stByPhase=new Map();
  runs.forEach(r=>r.phases.forEach(p=>{ const k=canon(p.phase_name);

  c1.appendChild(hbars([...stByPhase.values()].sort((a,b)=>(b.degraded+b.aborted)-(a.degraded+a.aborted)).map(o=>({
    label:o.key,
    segs:[{v:o.executed,color:cssv("--ok"),name:stLabel("executed")},
          {v:o.degraded,color:cssv("--warn"),name:stLabel("degraded")},
          {v:o.aborted,color:cssv("--bad"),name:stLabel("aborted")},
          {v:o.skipped,color:cssv("--g2"),name:stLabel("skipped")}]
  })),{labelWidth:64,valueWidth:56,fmt:v=>nf(v),axisFmt:v=>nf(v),kind:"count"}));
  g1.appendChild(c1);

  const c2=card(t("ql.c2"),t("ql.c2s"));
  c2.appendChild(hbars(runs.map(r=>{
    const h=r.phases.filter(p=>p.status==="executed").length/r.phases.length*100;
    return {label:r.project, flag:r.date,
      segs:[{v:h,color:h>=90?cssv("--ok"):h>=70?cssv("--warn"):cssv("--bad"),name:"Health"}],
      forceLabel:true,
      tipRows:[{color:cssv("--ok"),name:t("tip.health"),value:pct(h)},
               {color:"transparent",name:t("tip.executedOf"),value:nf(r.nOk)+" / "+nf(r.phases.length)},
               {color:"transparent",name:t("tip.degraded"),value:nf(r.nDeg)},
               {color:"transparent",name:t("tip.state"),value:runLabel(r.status)}],
      ref:r.id};
  }),{labelWidth:190,valueWidth:62,fmt:v=>nf1(v)+"%",axisFmt:v=>nf(v)+"%",
      onClick:it=>{ state.drill=it.ref; state.tab=1; render(); }}));
  g1.appendChild(c2);
  f.appendChild(g1);

  const g2=el("div","grid g2");
  const degList=[];
  runs.forEach(r=>r.phases.filter(p=>p.status==="degraded"||p.status==="aborted")
    .forEach(p=>degList.push({run:r,p})));
  const cDeg=card(t("ql.deg"),degList.length?null:t("empty.none"));
  if(degList.length) cDeg.appendChild(table(
    [t("col.project"),t("col.phase"),t("col.state"),t("col.date"),{t:t("col.tokens"),num:1}],
    degList.map(x=>({ref:x.run,cells:[
      {v:x.run.project,cls:"mn"},{v:x.p.phase_name,cls:"mn"},{node:pill(x.p.status)},
      {v:x.run.date,cls:"mn"},{v:x.p.token_usage.total_tokens?nf(x.p.token_usage.total_tokens):"—",cls:"num"}]})),
    null,r=>{ state.drill=r.id; state.tab=1; render(); }));
  g2.appendChild(cDeg);

  const noTelList=[];
  runs.forEach(r=>r.phases.filter(noTel).forEach(p=>noTelList.push({run:r,p})));
  const cNo=card(t("ql.notel"), t("ql.notels"));
  if(noTelList.length) cNo.appendChild(table(
    [t("col.project"),t("col.phase"),t("col.endUtc")],
    noTelList.map(x=>({ref:x.run,cells:[
      {v:x.run.project,cls:"mn"},{v:x.p.phase_name,cls:"mn"},{v:ts(x.p.end_time_utc),cls:"mn"}]}))));
  else cNo.appendChild(el("p","empty",t("empty.none")));
  g2.appendChild(cNo);
  f.appendChild(g2);

  const days=byDay(runs);
  const qual=days.map(d=>{
    const rs=runs.filter(r=>r.date===d.key);
    const p=rs.flatMap(r=>r.phases);
    return p.length ? p.filter(x=>x.status==="executed").length/p.length*100 : 0;
  });
  const cTr=card(t("ql.trend"),t("ql.trends"));
  cTr.appendChild(trend(days.map(d=>dmy(d.key)),[{name:t("ql.cleanPhases"),color:cssv("--ok"),points:qual}],
    {fmt:v=>nf(v)+"%",titles:days.map(d=>d.key)}));
  f.appendChild(cTr);
  return f;
}

/* ═══════════════════ PÁGINA 6 — FACTORY OPERATIONS ═══════════════════ */
function pageFactory(){
  const f=frag(), runs=scope();
  f.appendChild(pageHead(t("fa.title"), t("fa.desc")));
  if(!runs.length){ f.appendChild(el("p","empty",t("empty.runs"))); return f; }

  const groups=byPhase(runs,macroOf);
  const order=["Assessment","Design","Migration","Other"];
  const G=order.map(k=>groups.find(g=>g.key===k)).filter(Boolean);
  const totTime=sum(G,g=>g.time), totTok=sum(G,g=>g.tokens), totCost=sum(G,g=>g.cost);
  const COL={Assessment:S2(),Design:S3(),Migration:S1(),Other:cssv("--g2")};

  f.appendChild(kpiRow(G.map(g=>[
    macroLabel(g.key), hms(g.time),
    t("fa.kpi.sub",{tok:compact(g.tokens),cost:usd(g.cost)}),
    g.key==="Migration"?"warn":g.key==="Other"?"mute":null
  ])));

  const g1=el("div","grid g3");
  const legend=G.map(g=>({name:macroLabel(g.key),color:COL[g.key]}));
  const c1=card(t("fa.c1"),t("fa.c1s"),legend);
  c1.appendChild(donut(G.map(g=>({label:macroLabel(g.key),value:g.time,color:COL[g.key]})),
    t("fa.donut.time"),hms(totTime).slice(0,5)));
  g1.appendChild(c1);
  const c2=card(t("fa.c2"),t("fa.c2s"),legend);
  c2.appendChild(donut(G.map(g=>({label:macroLabel(g.key),value:g.tokens,color:COL[g.key]})),
    t("fa.donut.tokens"),compact(totTok)));
  g1.appendChild(c2);
  const c3=card(t("fa.c3"),t("fa.c3s"),legend);
  c3.appendChild(donut(G.map(g=>({label:macroLabel(g.key),value:g.cost,color:COL[g.key]})),
    t("fa.donut.cost"),usd(totCost)));
  g1.appendChild(c3);
  f.appendChild(g1);

  const c4=card(t("fa.c4"), t("fa.c4s"));
  c4.appendChild(hbars(G.map(g=>({
    label:macroLabel(g.key), segs:[{v:g.tin?g.tout/g.tin:0,color:COL[g.key],name:t("tip.efficiency")}], forceLabel:true,
    tipRows:[{color:COL[g.key],name:t("tip.efficiency"),value:nf2(g.tin?g.tout/g.tin:0)},
             {color:S2(),name:t("tip.input"),value:nf(g.tin)},{color:S1(),name:t("tip.output"),value:nf(g.tout)},
             {color:"transparent",name:t("tip.tokensPerHour"),value:compact(g.time?g.tokens/(g.time/3600):0)}]
  })),{labelWidth:110,valueWidth:64,fmt:nf2,axisFmt:nf2}));
  f.appendChild(c4);

  const cT=card(t("fa.table"),null);
  cT.appendChild(table(
    [t("col.macro"),{t:t("col.phases"),num:1},{t:t("col.time"),num:1},{t:t("col.pctTime"),num:1},
     {t:t("col.input"),num:1},{t:t("col.output"),num:1},{t:t("col.tokens"),num:1},
     {t:t("col.pctTokens"),num:1},{t:t("col.cost"),num:1},{t:t("col.efficiency"),num:1}],
    G.map(g=>({ref:g,cells:[
      {v:macroLabel(g.key)},{v:nf(g.n),cls:"num"},{v:hms(g.time),cls:"num"},{v:pct(g.time/totTime*100),cls:"num"},
      {v:nf(g.tin),cls:"num"},{v:nf(g.tout),cls:"num"},{v:nf(g.tokens),cls:"num"},
      {v:pct(g.tokens/totTok*100),cls:"num"},{v:usd(g.cost),cls:"num"},
      {v:g.tin?nf2(g.tout/g.tin):"—",cls:"num"}]})),
    [{v:t("row.total")},{v:nf(sum(G,g=>g.n)),cls:"num"},{v:hms(totTime),cls:"num"},{v:pct(100),cls:"num"},
     {v:nf(sum(G,g=>g.tin)),cls:"num"},{v:nf(sum(G,g=>g.tout)),cls:"num"},{v:nf(totTok),cls:"num"},
     {v:pct(100),cls:"num"},{v:usd(totCost),cls:"num"},{v:"",cls:"num"}]));
  f.appendChild(cT);
  return f;
}

const MODELS=[
  {id:"kimi-k2-6",      name:"Kimi-K2.6",                              vendor:"OpenAI"},
  {id:"kimi-k2-7-code", name:"Kimi-K2.7-Code",                         vendor:"OpenAI"},
  {id:"claude-sonnet-4-6", name:"claude-sonnet-4-6",                   vendor:"Anthropic", def:[3.00,15.00], baseline:true},
  {id:"fw-glm-5-2",     name:"FW-GLM-5.2",                             vendor:"OpenAI"},
  {id:"fw-minimax-m3",  name:"FW-MiniMax-M3",                          vendor:"OpenAI"},
  {id:"gpt-5-6-luna",   name:"gpt-5.6-luna",                           vendor:"OpenAI"},
  {id:"llama-4-mav",    name:"Llama-4-Maverick-17B-128E-Instruct-FP8", vendor:"OpenAI"}
];
function modelRate(m){
  const s=state.models[m.id];
  if(s && (s.in>0||s.out>0)) return [s.in||0,s.out||0,true];
  if(m.def) return [m.def[0],m.def[1],true];
  return [0,0,false];
}
function pageModels(){
  const f=frag(), runs=scope();
  f.appendChild(pageHead(t("md.title"), t("md.desc")));

  const b=el("div","banner");
  b.appendChild(el("span","ic warn","!"));
  const bt=el("div");
  const p1=el("p"); p1.appendChild(el("b","",t("md.warn1")));
  p1.appendChild(document.createTextNode(
    t("md.warn1b",{i:usd(3),o:usd(15)})));
  const p2=el("p"); p2.appendChild(document.createTextNode(t("md.warn2")));
  bt.appendChild(p1); bt.appendChild(p2); b.appendChild(bt);
  f.appendChild(b);

  const tin=sum(runs,r=>r.tin), tout=sum(runs,r=>r.tout);
  const base=MODELS.find(m=>m.baseline), baseRate=modelRate(base);
  const baseCost=cost(tin,tout,baseRate[0],baseRate[1]);

  f.appendChild(kpiRow([
    [t("md.k1"),compact(tin+tout),t("md.k1s",{i:nf(tin),o:nf(tout)})],
    [t("md.k2"),nf(runs.length),t("md.k2s")],
    [t("md.k3"),usd(baseCost),base.name,"ok"],
    [t("md.k4"),t("md.k4v",{n:nf(MODELS.filter(m=>modelRate(m)[2]).length),t:MODELS.length}),t("md.k4s")]
  ]));

  const cIn=card(t("md.rates"),t("md.ratess"));
  const rowsD=MODELS.map(m=>{
    const [ri,ro,has]=modelRate(m);
    const mkInput=(which,val)=>{
      const i=el("input"); i.type="number"; i.min="0"; i.step="0.01";
      i.value = (state.models[m.id] && state.models[m.id][which]!==undefined)
        ? state.models[m.id][which] : (m.def ? m.def[which==="in"?0:1] : "");
      i.placeholder="—"; i.setAttribute("aria-label",t(which==="in"?"md.aria.in":"md.aria.out",{m:m.name}));
      i.addEventListener("change",()=>{
        state.models[m.id]=Object.assign({},state.models[m.id]);
        const v=parseFloat(i.value);
        state.models[m.id][which]=isNaN(v)?0:v;
        save(); render();
      });
      return i;
    };
    const bd=el("span","badge"+(m.baseline?"":has?" ok":" mute"),
                t(m.baseline?"md.badge.default":has?"md.badge.set":"md.badge.none"));
    return {ref:m,cells:[
      {v:m.name,cls:"mn"},{v:m.vendor},{node:bd},
      {node:mkInput("in"),cls:"num"},{node:mkInput("out"),cls:"num"},
      {v:has?usd(cost(tin,tout,ri,ro)):"—",cls:"num"},
      {v:has?(m.baseline?"—":((cost(tin,tout,ri,ro)/baseCost-1)*100>=0?"+":"")+nf1((cost(tin,tout,ri,ro)/baseCost-1)*100)+"%"):"—",cls:"num"}
    ]};
  });
  cIn.appendChild(table(
    [t("col.model"),t("col.vendor"),t("col.rate"),
     {t:t("col.inPerM",{c:CUR().trim()}),num:1},{t:t("col.outPerM",{c:CUR().trim()}),num:1},
     {t:t("col.volumeCost"),num:1},{t:t("col.vsDefault"),num:1}], rowsD));
  const mt=cIn.querySelector("table"); if(mt) mt.classList.add("mtbl");
  f.appendChild(cIn);

  const ready=MODELS.filter(m=>modelRate(m)[2]);
  if(ready.length>1){
    const c=card(t("md.cmp"), t("md.cmps",{n:compact(tin+tout)}),
      [{name:t("tip.input"),color:S2()},{name:t("tip.output"),color:S1()}]);
    c.appendChild(hbars(ready.map(m=>{ const [ri,ro]=modelRate(m);
      return {label:m.name, flag:m.baseline?t("flag.baseline"):null,
        segs:[{v:cost(tin,0,ri,ro),color:S2(),name:t("tip.input")},{v:cost(0,tout,ri,ro),color:S1(),name:t("tip.output")}],
        tipRows:[{color:S2(),name:t("tip.inputCost"),value:usd(cost(tin,0,ri,ro))},
                 {color:S1(),name:t("tip.outputCost"),value:usd(cost(0,tout,ri,ro))},
                 {color:"transparent",name:t("tip.total"),value:usd(cost(tin,tout,ri,ro))},
                 {color:"transparent",name:t("md.tip.rate"),value:t("md.tip.ratev",{i:usd(ri),o:nf2(ro)})}]};
    }).sort((a,b)=>a.segs[0].v+a.segs[1].v-(b.segs[0].v+b.segs[1].v)),
      {labelWidth:250,valueWidth:92,fmt:usd,axisFmt:usd0}));
    f.appendChild(c);

    const cheapest=ready.map(m=>{ const [ri,ro]=modelRate(m); return {m,c:cost(tin,tout,ri,ro)}; })
                        .sort((a,b)=>a.c-b.c)[0];
    if(cheapest && cheapest.m.id!==base.id){
      const save_=baseCost-cheapest.c;
      const ins=el("div","insights");
      ins.appendChild(insight(t("md.cheapest"),cheapest.m.name,
        t("md.cheapests",{c:usd(cheapest.c),b:usd(baseCost),m:base.name,
                          d:usd(Math.abs(save_)),p:pct(Math.abs(save_/baseCost*100))})));
      ins.appendChild(insight(t("md.caveat"),t("md.caveatTitle"),
        t("md.caveats",{p:pct(runs.filter(r=>r.status==="completed").length/Math.max(runs.length,1)*100)})));
      f.appendChild(ins);
    }
  } else {
    f.appendChild(el("p","empty",t("md.needMore")));
  }

  const cP=card(t("md.perProject"),t("md.perProjects"));
  const projs=byProject(runs).sort((a,b)=>b.tokens-a.tokens);
  cP.appendChild(table(
    [t("col.project"),{t:t("col.tokens"),num:1}].concat(ready.map(m=>({t:m.name,num:1}))),
    projs.map(p=>({ref:p,cells:[{v:p.key,cls:"mn"},{v:nf(p.tokens),cls:"num"}].concat(
      ready.map(m=>{ const [ri,ro]=modelRate(m); return {v:usd(cost(p.tin,p.tout,ri,ro)),cls:"num"}; }))})),
    [{v:t("row.total")},{v:nf(tin+tout),cls:"num"}].concat(
      ready.map(m=>{ const [ri,ro]=modelRate(m); return {v:usd(cost(tin,tout,ri,ro)),cls:"num"}; }))));
  f.appendChild(cP);
  return f;
}

/* ═══════════════════ ALERTAS ═══════════════════ */
function buildAlerts(runs,finopsOnly){
  const c=card(t("al.title"),t("al.sub"));
  const list=el("div","alist");
  const ph=byPhase(runs,canon);
  const totTime=sum(ph,p=>p.time), totTok=sum(ph,p=>p.tokens);
  const avgCost=sum(runs,runCost)/Math.max(runs.length,1);
  let n=0;

  if(!finopsOnly){
    ph.filter(p=>totTime&&p.time/totTime>0.2).sort((a,b)=>b.time-a.time).forEach(p=>{
      list.appendChild(alert_("warn",t("al.slowPhase",{k:p.key,p:pct(p.time/totTime*100)}),
        t("al.slowPhaseM",{t:hms(p.time),n:p.n}))); n++; });
    ph.filter(p=>totTok&&p.tokens/totTok>0.2).sort((a,b)=>b.tokens-a.tokens).forEach(p=>{
      list.appendChild(alert_("warn",t("al.hotPhase",{k:p.key,p:pct(p.tokens/totTok*100)}),
        t("al.hotPhaseM",{n:nf(p.tokens)}))); n++; });
  }
  runs.filter(r=>r.status==="aborted"||r.status==="failed").forEach(r=>{
    list.appendChild(alert_("bad",t("al.aborted",{p:r.project}),
      t("al.abortedM",{id:r.id,d:r.date,a:r.nAb,g:r.nDeg}))); n++; });
  runs.filter(r=>r.status==="completed_with_warnings").forEach(r=>{
    list.appendChild(alert_("warn",t("al.warned",{p:r.project}),
      t("al.warnedM",{n:r.nDeg,t:r.phases.length,d:r.date}))); n++; });
  runs.filter(r=>runCost(r)>avgCost*1.5).sort((a,b)=>runCost(b)-runCost(a)).forEach(r=>{
    list.appendChild(alert_("warn",t("al.costly",{p:r.project}),
      t("al.costlyM",{c:usd(runCost(r)),a:usd(avgCost),
                      p:nf1((runCost(r)/avgCost-1)*100)+"%"}))); n++; });

  const noTelTotal=sum(runs,r=>r.nNoTel);
  if(noTelTotal){ list.appendChild(alert_("info",t("al.noTel",{n:noTelTotal}),
    t("al.noTelM"))); n++; }
  if(DATA.duplicates && DATA.duplicates.length){
    DATA.duplicates.forEach(d=> list.appendChild(alert_("info",t("al.dup",{a:d.archive}),
      t("al.dupM",{o:d.duplicate_of,id:d.execution_id}))));
    n+=DATA.duplicates.length;
  }
  if(!n) list.appendChild(el("p","empty",t("al.none")));
  c.appendChild(list); return c;
}

/* ═══════════════════ INSIGHTS ═══════════════════ */
function buildInsights(runs){
  const c=card(t("in.title"),t("in.sub"));
  const g=el("div","insights");
  const ph=byPhase(runs,canon), projs=byProject(runs);
  const totTime=sum(ph,p=>p.time), totTok=sum(ph,p=>p.tokens);

  const slow=[...ph].sort((a,b)=>b.time-a.time)[0];
  if(slow) g.appendChild(insight(t("in.bottleneck"),slow.key,
    t("in.bottleneckD",{t:hms(slow.time),p:pct(slow.time/totTime*100),n:slow.n})));

  const dear=[...projs].sort((a,b)=>b.cost-a.cost)[0];
  if(dear) g.appendChild(insight(t("in.costliest"),dear.key,
    t("in.costliestD",{c:usd(dear.cost),n:dear.n,tok:compact(dear.tokens)})));

  const effProj=projs.filter(p=>p.time>0).map(p=>({p,v:p.tokens/(p.time/3600)}))
                     .sort((a,b)=>b.v-a.v)[0];
  if(effProj) g.appendChild(insight(t("in.efficient"),effProj.p.key,
    t("in.efficientD",{v:compact(effProj.v)})));

  const hungry=[...ph].sort((a,b)=>b.tokens-a.tokens)[0];
  if(hungry) g.appendChild(insight(t("in.hungry"),hungry.key,
    t("in.hungryD",{tok:compact(hungry.tokens),p:pct(hungry.tokens/totTok*100),c:usd(hungry.cost)})));

  const worst=ph.filter(p=>p.tin>0).map(p=>({p,e:p.tout/p.tin})).sort((a,b)=>a.e-b.e)[0];
  if(worst) g.appendChild(insight(t("in.worst"),worst.p.key,
    t("in.worstD",{e:nf2(worst.e),i:compact(worst.p.tin),o:compact(worst.p.tout)})));

  const days=byDay(runs);
  if(days.length>=2){
    const first=days[0].cost, last=days[days.length-1].cost;
    const delta=first? (last/first-1)*100 : 0;
    g.appendChild(insight(t("in.trend"),(delta>=0?"+":"")+nf1(delta)+"%",
      t("in.trendD",{a:usd(first),da:dmy(days[0].key),
                     b:usd(last),db:dmy(days[days.length-1].key)})));
  }

  const rec=[];
  if(slow && slow.time/totTime>0.2) rec.push(t("in.recSplit",{k:slow.key}));
  if(worst && worst.e<0.15) rec.push(t("in.recContext",{k:worst.p.key}));
  const noTelTotal=sum(runs,r=>r.nNoTel);
  if(noTelTotal) rec.push(t("in.recInstrument",{n:noTelTotal}));
  g.appendChild(insight(t("in.rec"),rec.length?t("in.recN",{n:rec.length}):t("in.recNone"),
    rec.length?rec.join(" · ")+".":t("in.recNoneD")));

  c.appendChild(g); return c;
}

function queryString(){
  const q=new URLSearchParams();
  state.projects.forEach(p=>q.append("project",p));
  if(state.status)   q.set("status",state.status);
  if(state.mode)     q.set("mode",state.mode);
  if(state.dateFrom) q.set("from",state.dateFrom);
  if(state.dateTo)   q.set("to",state.dateTo);
  return q.toString();
}

/* Compara o execution_status de cada projeto com a leitura anterior.
   É esse atributo que o painel acompanha em tempo real. */
function diffStatuses(previous, current){
  if(!previous) return [];
  const out=[];
  Object.keys(current||{}).forEach(id=>{
    const was=previous[id], now=current[id];
    if(was!==undefined && was!==now) out.push({id, from:was, to:now});
    else if(was===undefined) out.push({id, from:null, to:now});
  });
  Object.keys(previous).forEach(id=>{
    if(!(id in (current||{}))) out.push({id, from:previous[id], to:null});
  });
  return out;
}

async function reload(manual){
  if(state.loading) return;
  state.loading=true; state.error=null;
  document.body.setAttribute("aria-busy","true");
  const btn=document.getElementById("btn-refresh");
  if(btn){ btn.disabled=true; btn.textContent=t("btn.refreshing"); }
  try{
    const qs=queryString();
    const response=await fetch("/api/dashboard-data"+(qs?"?"+qs:""),
                               {headers:{"Accept":"application/json"},cache:"no-store"});
    const payload=await response.json();
    if(!response.ok || payload.status!=="success"){
      state.error=payload.error||("HTTP "+response.status);
    } else {
      state.changes=diffStatuses(state.lastStatuses, payload.statuses||{});
      state.lastStatuses=payload.statuses||{};
      DATA=payload; buildRuns();
    }
  }catch(err){
    state.error=t("load.failed");
  }finally{
    state.loading=false;
    document.body.removeAttribute("aria-busy");
    if(btn){ btn.disabled=false; btn.textContent=t("btn.refresh"); }
  }
  schedulePoll();
  renderFilters(); render();
}

/* Enquanto houver execução com status "running", repolla na cadência do
   app.yaml (refresh.interval_seconds). Sem nenhuma rodando, para sozinho. */
function schedulePoll(){
  if(state.timer){ clearTimeout(state.timer); state.timer=null; }
  if(state.tick){ clearInterval(state.tick); state.tick=null; }
  state.nextAt=null;
  const live=(DATA.in_progress||[]).length;
  if(!live) return;
  const seconds=Math.max(5, Number(DATA.refresh_interval_seconds)||30);
  state.nextAt=Date.now()+seconds*1000;
  state.timer=setTimeout(()=>reload(false), seconds*1000);
  state.tick=setInterval(()=>{
    const nodes=document.querySelectorAll("[data-countdown]");
    if(!nodes.length) return;
    const left=Math.max(0, Math.round((state.nextAt-Date.now())/1000));
    nodes.forEach(n=>n.textContent=t("live.next",{n:left}));
  },1000);
}

/* Faixa de acompanhamento ao vivo + transições desde a leitura anterior. */
function liveBanner(){
  const box=frag();
  const live=(DATA.in_progress||[]).filter(id=>RUNS.some(r=>r.projectId===id));
  if(live.length){
    const bar=el("div","livebar");
    bar.appendChild(el("span","dot"));
    const tx=el("div");
    tx.appendChild(el("b","", live.length===1
      ? t("live.one") : t("live.many",{n:live.length})));
    tx.appendChild(el("div","names", live.join(" · ")));
    bar.appendChild(tx);
    const next=el("span","next"); next.setAttribute("data-countdown","1");
    next.textContent=t("live.tracking");
    bar.appendChild(next);
    box.appendChild(bar);
  }
  if(state.changes.length){
    const list=el("div","alist");
    state.changes.forEach(c=>{
      const label = c.to===null ? t("live.outOfScope")
        : c.from===null ? t("live.enteredScope",{s:runLabel(c.to)})
        : runLabel(c.from)+" → "+runLabel(c.to);
      const a=alert_(c.to==="running"?"warn":c.to?"ok":"info",
                     t("live.changed",{id:c.id}), label);
      a.classList.add("chg");
      list.appendChild(a);
    });
    box.appendChild(list);
    const spacer=el("div"); spacer.style.height="14px"; box.appendChild(spacer);
  }
  return box;
}


PAGES.forEach((p,i)=>{
  const b=el("button","tab",t(p.key)); b.type="button"; b.setAttribute("role","tab"); b.id="tab-"+p.id;
  b.addEventListener("click",()=>{ state.tab=i; location.hash="#/"+p.id; render(); });
  b.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault();
      state.tab=(i+(e.key==="ArrowRight"?1:PAGES.length-1))%PAGES.length; render();
      tabsEl.children[state.tab].focus(); }});
  tabsEl.appendChild(b);
});

function render(){
  Array.from(tabsEl.children).forEach((b,j)=>{
    b.setAttribute("aria-selected",j===state.tab?"true":"false");
    b.textContent=t(PAGES[j].key);
  });
  hideTip();
  if(state.error){
    const box=el("div","note err");
    box.appendChild(el("span","ic bad","×"));
    const tx=el("div","atx");
    tx.appendChild(el("b","",t("load.failed")));
    tx.appendChild(el("span","ameta",state.error));
    box.appendChild(tx);
    viewEl.replaceChildren(box);
    return;
  }
  viewEl.replaceChildren(PAGES[state.tab].render());
  viewEl.setAttribute("aria-labelledby","tab-"+PAGES[state.tab].id);
  if(stampEl) stampEl.textContent = t("stamp.summary",{n:RUNS.length,at:DATA.generated_at||""});
  const live=(DATA.in_progress||[]).length;
  const dot=document.getElementById("livedot"), tx=document.getElementById("livetx");
  if(dot && tx){
    if(live){ dot.hidden=false; tx.textContent=t("topbar.live",{n:live}); }
    else dot.hidden=true;
  }
  window.scrollTo({top:0,behavior:"instant"});
}

const btn=document.getElementById("theme-btn");
function applyTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const dark = cur==="dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.getElementById("theme-ic").textContent = dark?"☀":"☾";
  document.getElementById("theme-tx").textContent = t(dark?"theme.light":"theme.dark");
}

/* Textos fixos da casca — o restante da tela é redesenhado por render(),
   mas topbar e abas vivem fora dele e precisam ser reescritos na troca. */
function applyStaticTexts(){
  document.documentElement.lang = LANG==="pt" ? "pt-BR" : "en";
  document.getElementById("tm-sub").textContent = t("app.subtitle")+" · "+ROOT_SOURCE;
  document.getElementById("btn-refresh").textContent =
    state.loading ? t("btn.refreshing") : t("btn.refresh");
  tabsEl.setAttribute("aria-label", t("tabs.aria"));
  langsw.setAttribute("aria-label", t("lang.aria"));
  btn.setAttribute("aria-label", t("theme.aria"));
  applyTheme();
}

/* Troca de idioma: só reescreve a tela — não refaz a chamada ao servidor,
   porque a tradução é do rótulo, nunca do dado. */
const langsw=document.getElementById("langsw");
Array.from(langsw.querySelectorAll("button")).forEach(b=>{
  b.addEventListener("click",()=>{
    const chosen=b.getAttribute("data-lang");
    if(chosen===LANG) return;
    LANG=chosen; save();
    applyStaticTexts(); markLang(); renderFilters(); render();
  });
});
function markLang(){
  Array.from(langsw.querySelectorAll("button")).forEach(b=>
    b.setAttribute("aria-pressed", b.getAttribute("data-lang")===LANG ? "true":"false"));
}
btn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark = cur==="dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
  applyTheme(); save(); renderFilters(); render();
});
if(window.matchMedia){
  const mq=window.matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener) mq.addEventListener("change",()=>{ applyTheme(); render(); });
}

function tabFromHash(){
  const id=(location.hash||"").replace(/^#\/?/,"");
  const i=PAGES.findIndex(p=>p.id===id);
  if(i>=0) state.tab=i;
}
window.addEventListener("hashchange",()=>{ tabFromHash(); render(); });
document.getElementById("btn-refresh").addEventListener("click",()=>reload(true));
tabFromHash(); applyStaticTexts(); markLang();
if(stampEl) stampEl.textContent=t("stamp.loading");
reload();
</script>
