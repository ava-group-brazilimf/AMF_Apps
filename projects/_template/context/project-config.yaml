# Migration Design Gate Configuration
# Gate de qualidade que valida completude e consistência de TODOS os artefatos
# da fase F2 (Migration Design) ANTES de autorizar transição para Build Cycle (F3).
# Referência: src/shared/checklists/migration-design-checklist.md
# ─────────────────────────────────────────────────────────────────────────────
migration_design_gate:
  enabled: true                           # true = gate executa automaticamente após Fase 8
                                          # false = gate desabilitado (não recomendado)
  
  threshold_pct: 85                       # Score mínimo (%) para APPROVED_WITH_MINOR_GAPS
                                          # 100% = apenas APPROVED (todos os critérios atendidos)
                                          # 85-99% = APPROVED_WITH_MINOR_GAPS (gaps 🟢 apenas)
                                          # 70-84% = NEEDS_REMEDIATION (gaps 🟡 — bloqueado)
                                          # <70% = BLOCKED (gaps 🔴 ou score crítico)
  
  auto_execute_after_phase_8: true        # true = gate executa automaticamente após Fase 8
                                          # false = requer invocação manual
  
  block_build_cycle_if_fail: true         # true = Build Cycle (F3) bloqueado se veredicto != APPROVED
                                          # false = continua com warning (NÃO RECOMENDADO)
  
  generate_evidence_report: true          # true F= gera migration-design-gate-evidence.json
                                          # false = apenas migration-design-gate-report.md
  
  evidence_output_path: "outputs/tobe/docs/migration-design-gate-evidence.json"
                                          # Path relativo ao projeto para evidência JSON
  
  report_output_path: "outputs/tobe/docs/migration-design-gate-report.md"
                                          # Path relativo ao projeto para relatório markdown

# ─────────────────────────────────────────────────────────────────────────────
# Requestor Inspection & Validation
# Atualizar após sessão de inspeção formal com o Requestor (cliente/sponsor).
# Gate obrigatório entre F2 (Migration Design) e F3 (Build Cycle).
# Preenchido pelo agente @ava-requestor-inspection na geração do pacote.
# PM atualiza status para "APPROVED" após sessão com o Requestor.

# ─────────────────────────────────────────────────────────────────────────────
# Package Approval Document — Human SME Sign-Off
# Atualizar após sessão de revisão técnica com o Human SME.
# Gate entre F2 (Migration Design) e F3 (Build Cycle).
# Documento gerado pelo agente @ava-deliverable-package-approval-doc.
# PM atualiza status para "APPROVED" após coleta de assinatura do Human SME.
# ─────────────────────────────────────────────────────────────────────────────
package_approval_doc:
  status: "PENDING"        # PENDING | APPROVED | BLOCKED
  approved_by: ""          # Nome do Human SME que assinou formalmente
  approval_date: ""        # ISO 8601: "2026-MM-DD"
  notes: ""                # Condicionantes técnicas ou observações do SME

# ─────────────────────────────────────────────────────────────────────────────
# Strategy Align — PM-Led Alignment Session with Requestor
# Sessão facilitada pelo PM com o Requestor para validar soluções, priorizar
# BCs, alinhar dependências de infra e registrar aprovação formal do pacote.
# Gate soft/informacional — não bloqueia a esteira.
# Documento gerado pelo agente @ava-deliverable-strategy-align.
# PM atualiza status para "COMPLETED" após conduzir a sessão.
# ─────────────────────────────────────────────────────────────────────────────
requestor_inspection:
  status: "PENDING"        # PENDING | APPROVED | BLOCKED
  approved_by: ""          # Nome do Requestor que aprovou formalmente
  approval_date: ""        # ISO 8601: "2026-MM-DD"
  notes: ""                # Condicionantes ou observações do Requestor
strategy_align:
  status: "PENDING"        # PENDING | COMPLETED | DEFERRED
  session_date: ""         # ISO 8601: "2026-MM-DD"
  facilitator: ""          # Nome do PM que conduziu a sessão
  attendees: []            # Lista de participantes
  bc_priorities_confirmed: false
  infra_deps_aligned: false
  pilot_poc_decision: ""   # "NONE" | "PILOT" | "POC"
  formal_approval: false
  record_path: ""          # Path do strategy-align-record.md gerado
  notes: ""

# ─────────────────────────────────────────────────────────────────────────────
# Readiness Gate — Sign-offs por Wave
# Preencher após aprovação formal na sessão de Requestor Inspection (K1/K2/K3).
# Referência: src/shared/checklists/readiness-gate-checklist.md
# ─────────────────────────────────────────────────────────────────────────────
signoffs:
  architecture_approved_by_client: false  # true após aprovação formal do Cliente na arquitetura TO-BE
  spec_kit_approved: false                # true após revisão e aprovação formal do Spec Kit
  sponsor_signoff: false                  # true após sign-off formal do Sponsor do projeto
  stakeholder_signoff: false              # true após sign-off dos Stakeholders envolvidos
  signoff_date: ""                        # ISO 8601: "2026-05-18" — data do sign-off mais recente
  signed_by: ""                           # Nome do responsável pelo sign-off registrado

# ─────────────────────────────────────────────────────────────────────────────
# Wave Approval — Configuração de Testes de Paridade Funcional
# Usados pelo agente @ava-devops-compare-version para executar golden dataset,
# disparar chamadas simultâneas AS-IS × TO-BE e calcular score de paridade por BC.
# Referência: src/modules/ava-fabric-agents/devops-agents/agents/compare-version-agent.md
# ─────────────────────────────────────────────────────────────────────────────
wave_approval:
  thresholds:
    parity_pct: 99.5            # Paridade funcional mínima (%) — global e por BC
    latency_avg_ms: 500         # Latência média máxima (ms)
    latency_p95_ms: 1000        # Latência P95 máxima (ms)
    throughput_min: 100         # Throughput mínimo (req/s)
    error_rate_max_pct: 1.0     # Error rate máximo (%)
    line_coverage_pct: 80       # Cobertura de linha mínima (%)
    branch_coverage_pct: 70     # Cobertura de branch mínima (%)
    vuln_high_max: 0            # Vulnerabilidades altas máximas
    fp_coverage_pct: 95         # FPs cobertos por testes (%)

  # Endpoints por operação presente no golden dataset.
  # Preencher um bloco por operação antes de executar @ava-devops-compare-version.
  # Exemplo:
  #   CriarPedido:
  #     asis_url: "http://legado.host/api/pedidos"
  #     tobe_url: "http://migrado.host/api/pedidos"
  parity_endpoints: {}          # Preencher por operação do golden dataset

  timeout_ms: 30000             # Timeout por chamada individual (ms) — default: 30 s
  numeric_tolerance: 0          # Delta máximo para campos numéricos (0 = match exato)
  ignore_tz: true               # Ignorar timezone em comparação de campos de data/hora

# ─────────────────────────────────────────────────────────────────────────────
# Quality Gates — Thresholds para o pipeline de CI gerado por @ava-devops-ci
# Lidos por ci-agent (Step 0) para gerar os gates no GitHub Actions e Azure DevOps.
# Se esta seção estiver ausente, o agente usa os defaults abaixo e emite aviso.
#
# Defaults (aplicados quando a seção ou campo individual estiver ausente):
#   coverage.line_min         → 80   (%)
#   coverage.branch_min       → 70   (%)
#   sonar.quality_gate        → "pass"
#   sonar.max_blocker_issues  → 0
#   sonar.max_critical_issues → 0
#   owasp.max_critical_cve    → 0
#   docker.trivy_max_critical → 0
# ─────────────────────────────────────────────────────────────────────────────
quality_gates:
  coverage:
    line_min: 80              # % — cobertura de linha mínima para o gate CI (default: 80)
    branch_min: 70            # % — cobertura de branch mínima para o gate CI (default: 70)
  sonar:
    quality_gate: "pass"      # "pass" | "<custom profile>" — default: "pass"
    max_blocker_issues: 0     # default: 0 — issues blocker permitidos
    max_critical_issues: 0    # default: 0 — issues critical permitidos
  owasp:
    max_critical_cve: 0       # default: 0 — CVEs críticos permitidos em dependências
  docker:
    trivy_max_critical: 0     # default: 0 — vulnerabilidades críticas Trivy permitidas
# ─────────────────────────────────────────────────────────────────────────────
