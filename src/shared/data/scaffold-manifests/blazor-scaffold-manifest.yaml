# Blazor WASM Scaffold Manifest — Mandatory Files
# Consumed by: verify_scaffold.py, coder-blazor-frontend, orchestrator-stack, build-validator
# Each entry: path (relative to frontend root), category, blocking (hard-stop if missing), error_if_missing
#
# blocking: true  → HARD STOP — dotnet build cannot succeed without this file
# blocking: false → WARNING — build may succeed but project is incomplete
#
# NOTE: {project_name_pascal} is resolved at runtime by the calling agent.
# The verify_scaffold.py script supports glob patterns for paths with wildcards.

manifest_id: blazor
version: "1.0.0"
description: "Mandatory files for any Blazor WebAssembly project generated by ava-stack-blazor-frontend"

files:
  # ─── Project Root ────────────────────────────────────────────────────────────
  - path: "*.csproj"
    category: project-root
    blocking: true
    error_if_missing: "dotnet build fails: NETSDK1004: Assets file project.assets.json not found"
    glob: true

  - path: ".gitignore"
    category: project-root
    blocking: false
    error_if_missing: "bin/, obj/ and appsettings.Local.json may be committed accidentally"

  # ─── Entry Points ────────────────────────────────────────────────────────────
  - path: "wwwroot/index.html"
    category: entry-point
    blocking: true
    error_if_missing: "dotnet publish fails: Could not find file 'wwwroot/index.html'"

  - path: "wwwroot/css/app.css"
    category: entry-point
    blocking: false
    error_if_missing: "index.html references missing css/app.css — browser 404 on load"

  - path: "wwwroot/appsettings.json"
    category: entry-point
    blocking: true
    error_if_missing: "IConfiguration empty at runtime — AddMsalAuthentication throws InvalidOperationException"

  - path: "wwwroot/appsettings.Development.json"
    category: entry-point
    blocking: false
    error_if_missing: "Development overrides unavailable — dev environment uses production placeholders"

  # ─── App Bootstrap ───────────────────────────────────────────────────────────
  - path: "Program.cs"
    category: app-bootstrap
    blocking: true
    error_if_missing: "dotnet build fails: CS5001: Program does not contain a static 'Main' method"

  - path: "_Imports.razor"
    category: app-bootstrap
    blocking: true
    error_if_missing: "dotnet build fails: CS0246 on every .razor file missing standard Blazor usings"

  - path: "App.razor"
    category: app-bootstrap
    blocking: true
    error_if_missing: "dotnet build fails: CS0246: The type 'App' could not be found (builder.RootComponents.Add<App>)"

  # ─── Layout ──────────────────────────────────────────────────────────────────
  - path: "Layout/MainLayout.razor"
    category: layout
    blocking: true
    error_if_missing: "dotnet build fails: BZWASM0003: layout 'MainLayout' referenced in App.razor not found"

  - path: "Layout/MainLayout.razor.cs"
    category: layout
    blocking: false
    error_if_missing: "partial class MainLayout missing — _drawerOpen and ToggleDrawer unresolved (CS0103)"

  - path: "Layout/NavMenu.razor"
    category: layout
    blocking: false
    error_if_missing: "MainLayout.razor references <NavMenu /> — CS0246 if file missing"

  - path: "Layout/NavMenu.razor.css"
    category: layout
    blocking: false
    error_if_missing: "Active NavLink styles missing — functional but visual regression"

  # ─── Auth ────────────────────────────────────────────────────────────────────
  - path: "Auth/CustomAuthorizationMessageHandler.cs"
    category: auth
    blocking: true
    error_if_missing: "dotnet build fails: CS0246 — AddHttpMessageHandler<CustomAuthorizationMessageHandler> unresolvable"

  - path: "Auth/AuthService.cs"
    category: auth
    blocking: true
    error_if_missing: "dotnet build fails: CS0246 — AddScoped<AuthService> unresolvable"

  - path: "Auth/RedirectToLogin.razor"
    category: auth
    blocking: true
    error_if_missing: "dotnet build fails: CS0246 — <RedirectToLogin /> in App.razor unresolvable"

  - path: "Pages/Authentication.razor"
    category: auth
    blocking: true
    error_if_missing: "dotnet build fails: RemoteAuthenticatorView route /authentication/{action} missing — MSAL redirect loop"

  # ─── Core Services ───────────────────────────────────────────────────────────
  - path: "Services/ErrorService.cs"
    category: core-services
    blocking: true
    error_if_missing: "dotnet build fails: CS0246 — AddScoped<ErrorService> unresolvable"

  - path: "Services/LoadingService.cs"
    category: core-services
    blocking: true
    error_if_missing: "dotnet build fails: CS0246 — AddScoped<LoadingService> unresolvable"

  - path: "Services/MoneyFormatService.cs"
    category: core-services
    blocking: false
    error_if_missing: "MoneyFormatService missing — monetary formatting will fail at runtime"

  # ─── Shared Components ───────────────────────────────────────────────────────
  - path: "Shared/LoadingOverlay.razor"
    category: shared-components
    blocking: true
    error_if_missing: "dotnet build fails: CS0246 — <LoadingOverlay /> in MainLayout.razor unresolvable"

  - path: "Shared/ErrorBanner.razor"
    category: shared-components
    blocking: true
    error_if_missing: "dotnet build fails: CS0246 — <ErrorBanner /> in MainLayout.razor unresolvable"

  - path: "Shared/EmptyState.razor"
    category: shared-components
    blocking: false
    error_if_missing: "EmptyState missing — BC pages with empty list will fail at runtime"

  - path: "Shared/PageHeader.razor"
    category: shared-components
    blocking: false
    error_if_missing: "PageHeader missing — BC pages will fail to render"

  - path: "Shared/StatusChip.razor"
    category: shared-components
    blocking: false
    error_if_missing: "StatusChip missing — status display in BC pages will fail"

  - path: "Shared/ConfirmDialog.razor"
    category: shared-components
    blocking: false
    error_if_missing: "ConfirmDialog missing — delete confirmation flows will fail"

  - path: "Shared/FormError.razor"
    category: shared-components
    blocking: false
    error_if_missing: "FormError missing — form validation display will fail"

  - path: "Shared/InfoCard.razor"
    category: shared-components
    blocking: false
    error_if_missing: "InfoCard missing — Dashboard summary cards will fail"

  - path: "Shared/ActionToolbar.razor"
    category: shared-components
    blocking: false
    error_if_missing: "ActionToolbar missing — BC page action buttons will fail"

  # ─── Pages ───────────────────────────────────────────────────────────────────
  - path: "Pages/Dashboard.razor"
    category: pages
    blocking: true
    error_if_missing: "dotnet build fails: / route missing — AuthorizeRouteView has no default page"

  # ─── Store (Fluxor) — glob, resolved per-BC at runtime ───────────────────────
  - path: "Store/*/*State.cs"
    category: fluxor-store
    blocking: false
    error_if_missing: "Fluxor feature state missing for one or more BCs — effects will throw at runtime"
    glob: true

  - path: "Store/*/*Actions.cs"
    category: fluxor-store
    blocking: false
    error_if_missing: "Fluxor actions missing for one or more BCs — dispatch calls unresolvable"
    glob: true

  - path: "Store/*/*Reducers.cs"
    category: fluxor-store
    blocking: false
    error_if_missing: "Fluxor reducers missing for one or more BCs — state never updates"
    glob: true

  - path: "Store/*/*Effects.cs"
    category: fluxor-store
    blocking: false
    error_if_missing: "Fluxor effects missing for one or more BCs — HTTP calls never dispatched"
    glob: true
