# React (Vite) Scaffold Manifest — Mandatory Files
# Consumed by: verify_scaffold.py, coder-react-frontend, orchestrator-stack, build-validator
# Each entry: path (relative to frontend root), category, blocking (hard-stop if missing), error_if_missing
#
# blocking: true  → HARD STOP — vite build cannot succeed without this file
# blocking: false → WARNING — build may succeed but project is incomplete

manifest_id: react
version: "1.0.0"
description: "Mandatory files for any React 18 + Vite project scaffold generated by ava-stack-react-frontend"

files:
  # ─── Config (project root) ─────────────────────────────────────────────────
  - path: "package.json"
    category: config
    blocking: true
    error_if_missing: "npm ci fails: ENOENT package.json"

  - path: "vite.config.ts"
    category: config
    blocking: true
    error_if_missing: "vite build fails: no config found, plugin @vitejs/plugin-react not applied (JSX unparsed)"

  - path: "tsconfig.json"
    category: config
    blocking: true
    error_if_missing: "tsc --noEmit fails: Cannot find tsconfig.json"

  - path: "tsconfig.node.json"
    category: config
    blocking: true
    error_if_missing: "tsc --noEmit fails: tsconfig.node.json referenced by tsconfig.json references[] not found"

  - path: "vitest.config.ts"
    category: config
    blocking: false
    error_if_missing: "vitest run fails: no coverage thresholds configured (build unaffected)"

  - path: ".gitignore"
    category: config
    blocking: false
    error_if_missing: "node_modules and dist may be committed accidentally"

  - path: ".env.example"
    category: config
    blocking: false
    error_if_missing: "VITE_* variables undocumented; import.meta.env values resolve to undefined at runtime"

  # ─── Entry Points ──────────────────────────────────────────────────────────
  - path: "index.html"
    category: entry-point
    blocking: true
    error_if_missing: "vite build fails: Could not resolve entry module \"index.html\""

  - path: "src/main.tsx"
    category: entry-point
    blocking: true
    error_if_missing: "vite build fails: Could not resolve \"/src/main.tsx\" from index.html"

  - path: "src/styles/tokens.css"
    category: entry-point
    blocking: true
    error_if_missing: "vite build fails: Failed to resolve import \"./styles/tokens.css\" from src/main.tsx"

  # ─── App Bootstrap ─────────────────────────────────────────────────────────
  - path: "src/App.tsx"
    category: app-bootstrap
    blocking: true
    error_if_missing: "vite build fails: Failed to resolve import \"./App\" from src/main.tsx"

  - path: "src/router/index.tsx"
    category: app-bootstrap
    blocking: true
    error_if_missing: "vite build fails: Failed to resolve import \"./router\" from src/App.tsx"

  # ─── Test Infrastructure ───────────────────────────────────────────────────
  - path: "src/test/setup.ts"
    category: test-infra
    blocking: false
    error_if_missing: "vitest run fails: setupFiles referenced in vitest.config.ts not found"

  - path: "src/test/utils.tsx"
    category: test-infra
    blocking: false
    error_if_missing: "generated *.test.tsx fail: cannot import renderWithProviders"

  # ─── Prototype Conversion (P2C) ────────────────────────────────────────────
  - path: "prototype-conversion-map.json"
    category: p2c
    blocking: false
    error_if_missing: "prototype fidelity assertion cannot run; screen coverage unverifiable"
