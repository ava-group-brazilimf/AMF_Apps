# ═══════════════════════════════════════════════════════════════════════════════
# AVA Fabric — Reference Architecture TO-BE (Fonte Única de Verdade)
# ═══════════════════════════════════════════════════════════════════════════════
# Este arquivo consolida stack tecnológica, padrões de arquitetura e princípios
# de referência para todos os projetos da fábrica. Os agentes TO-BE DEVEM
# consumir este arquivo como fonte canônica.
#
# Caminho canônico: src/shared/data/reference-architecture.yaml
# ═══════════════════════════════════════════════════════════════════════════════

version: "1.0.0"
last_updated: "2026-05-06"
maintainer: "AVA Fabric Architecture Team"

# ─────────────────────────────────────────────────────────────────────────────
# TECH STACK — Tecnologias alvo categorizadas por camada
# ─────────────────────────────────────────────────────────────────────────────
tech_stack:

  backend:
    runtime: ".NET 8"
    language: "C# 12"
    framework: "ASP.NET Core 8"
    orm: "Entity Framework Core 8"
    micro_orm: "Dapper"
    mediator: "MediatR 12"
    validation: "FluentValidation 11"
    mapping: "AutoMapper 13"
    logging: "Serilog 4"
    testing:
      unit: "xUnit 2.7"
      mocking: "Moq 4.20"
      assertions: "FluentAssertions 7"
      integration: "Testcontainers 3"
    api:
      documentation: "Swashbuckle (OpenAPI 3)"
      versioning: "Asp.Versioning 8"
      health: "AspNetCore.Diagnostics.HealthChecks"

  frontend:
    framework: "Angular 17"
    language: "TypeScript 5.3"
    state_management: "NgRx Signals"
    component_library: "Angular Material / Custom Design System"
    testing:
      unit: "Jest"
      e2e: "Playwright"
    build: "Nx (monorepo)"

  data:
    primary_database: "Azure SQL"
    cache: "Redis"
    migrations: "EF Core Migrations"
    search: "Azure Cognitive Search (quando aplicável)"

  infrastructure:
    cloud: "Microsoft Azure"
    container_runtime: "Azure Container Apps"
    api_gateway: "Azure API Management"
    message_broker: "Azure Service Bus"
    secrets: "Azure Key Vault"
    configuration: "Azure App Configuration"
    iac: "Bicep / Terraform"
    ci_cd: "Azure DevOps Pipelines"

  observability:
    logs: "Serilog → Application Insights"
    metrics: "OpenTelemetry → Azure Monitor"
    traces: "OpenTelemetry Distributed Tracing"
    correlation: "Correlation ID (W3C Trace Context)"
    alerting: "Azure Monitor Alerts (SLO-based)"
    dashboards: "Azure Workbooks / Grafana"

  security:
    identity: "Azure AD B2C"
    auth_protocol: "OAuth2 / OpenID Connect"
    token_library: "Microsoft.Identity.Web + MSAL"
    secrets_management: "Azure Key Vault"
    waf: "Azure Front Door WAF"
    sast: "SonarQube / GitHub Advanced Security"
    dependency_scan: "Dependabot / OWASP Dependency-Check"

# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE PATTERNS — Padrões estruturais de referência
# ─────────────────────────────────────────────────────────────────────────────
architecture_patterns:

  - id: PAT-001
    name: "Clean Architecture"
    description: "Separação em Domain, Application, Infrastructure, Presentation"
    layers:
      - "Domain (entities, value objects, domain events, interfaces)"
      - "Application (use cases, commands/queries, DTOs, validators)"
      - "Infrastructure (EF Core, external services, repositories)"
      - "Presentation (API controllers, middleware, filters)"
    status: mandatory

  - id: PAT-002
    name: "Modular Monolith"
    description: "Módulos por Bounded Context com fronteiras explícitas, evoluível para microsserviços"
    characteristics:
      - "Cada módulo = 1 Bounded Context"
      - "Comunicação inter-módulo via MediatR (in-process events)"
      - "Cada módulo tem seu próprio schema no banco"
      - "Fronteiras fortes: sem referência direta a entidades de outro módulo"
    evolution_path: "Modular Monolith → Microsserviços (quando escala justificar)"
    status: mandatory

  - id: PAT-003
    name: "CQRS (Command Query Responsibility Segregation)"
    description: "Separação de modelos de leitura e escrita via MediatR handlers"
    write_side: "Commands → Domain → Repository → DB"
    read_side: "Queries → Read Model (Dapper/View) → DTO"
    status: mandatory

  - id: PAT-004
    name: "Domain-Driven Design (DDD)"
    description: "Modelagem estratégica e tática baseada em domínio"
    strategic:
      - "Bounded Contexts com Context Map"
      - "Ubiquitous Language por contexto"
      - "Anti-Corruption Layers entre contextos"
    tactical:
      - "Aggregates, Entities, Value Objects"
      - "Domain Events, Domain Services"
      - "Repository pattern"
    status: mandatory

  - id: PAT-005
    name: "API-First / Contract-First"
    description: "Contratos OpenAPI definidos antes da implementação"
    practices:
      - "OpenAPI 3.0 spec como artefato de design"
      - "Versionamento de API (URL path ou header)"
      - "Contract testing entre front e back"
    status: mandatory

  - id: PAT-006
    name: "Micro Frontend (Domain-Aligned)"
    description: "Frontend modular alinhado aos Bounded Contexts do backend"
    practices:
      - "Módulos Angular lazy-loaded por domínio"
      - "Design System compartilhado (tokens, componentes base)"
      - "Performance budgets por módulo"
      - "Observability no frontend (RUM)"
    status: mandatory

  - id: PAT-007
    name: "Cloud-Native"
    description: "Aplicação containerizada, stateless, configurável por ambiente"
    practices:
      - "12-Factor App compliance"
      - "Container-ready (Docker multi-stage)"
      - "Config via environment/Azure App Configuration"
      - "Horizontal scaling via Azure Container Apps"
    status: mandatory

  - id: PAT-008
    name: "Resilience Patterns"
    description: "Padrões de resiliência para comunicação distribuída"
    patterns:
      - "Retry with exponential backoff (Polly)"
      - "Circuit Breaker (Polly)"
      - "Timeout policies"
      - "Bulkhead isolation"
      - "Graceful degradation"
      - "Health checks (liveness + readiness)"
    status: mandatory

  - id: PAT-009
    name: "Security First (Zero Trust, Secure-by-Design)"
    description: "Segurança integrada em todo o ciclo de desenvolvimento"
    practices:
      - "Zero Trust: nunca confiar, sempre verificar"
      - "Secure-by-Design: security como requisito não-funcional"
      - "Shift-Left: SAST/DAST no pipeline de CI"
      - "Principle of Least Privilege"
      - "Input validation em toda boundary"
      - "OWASP Top 10 compliance"
    status: mandatory

  - id: PAT-010
    name: "IaC / GitOps"
    description: "Infraestrutura como código com versionamento Git"
    practices:
      - "Bicep/Terraform para provisionamento"
      - "Environments: dev → staging → production"
      - "Infrastructure drift detection"
      - "Policy-as-Code (Azure Policy)"
    status: mandatory

# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE PRINCIPLES — Princípios norteadores
# ─────────────────────────────────────────────────────────────────────────────
architecture_principles:

  - id: PRINC-001
    name: "Observabilidade"
    pillars:
      - "Structured Logging (Serilog + correlation ID)"
      - "Metrics (OpenTelemetry counters, histograms)"
      - "Distributed Traces (W3C Trace Context)"
      - "SLO/SLI definition per service"
      - "Actionable Alerts (low noise, high signal)"
    status: mandatory

  - id: PRINC-002
    name: "Código Defensivo"
    practices:
      - "Fail Fast: validar inputs na boundary do sistema"
      - "Input Validation: FluentValidation em todo Command/Query"
      - "Idempotência: operações de escrita idempotentes (deduplication key)"
      - "Timeouts: toda chamada externa com timeout explícito"
      - "Retry + Circuit Breaker: Polly policies configuráveis"
      - "Graceful Degradation: fallback para funcionalidades não-críticas"
    status: mandatory

  - id: PRINC-003
    name: "Automação"
    practices:
      - "CI/CD: build, test, deploy automatizados"
      - "Policy Gates: quality gates no pipeline (coverage, SAST, lint)"
      - "Database migrations automatizadas (EF Core)"
      - "Infrastructure provisioning automatizado (IaC)"
    status: mandatory

  - id: PRINC-004
    name: "Evolução Incremental"
    practices:
      - "Backward Compatibility: API versioning, database migrations não-destrutivas"
      - "Feature Flags: rollout gradual de funcionalidades"
      - "Strangler Fig: migração incremental do legado"
      - "Blue/Green ou Canary deployment"
    status: mandatory

  - id: PRINC-005
    name: "Privacidade e Compliance by Design"
    practices:
      - "Compliance conforme jurisdição do projeto (LGPD, GDPR, CCPA, HIPAA — resolver via country em project-config.yaml)"
      - "Knowledge files: src/shared/data/compliance/{regulation}.yaml"
      - "Data classification (PII, sensitive, public)"
      - "Audit trail para dados sensíveis"
      - "Encryption at rest + in transit"
      - "Data retention policies (prazo derivado da regulação ativa)"
      - "Privacy by Design e by Default"
    status: mandatory

