# Angular scaffold — matriz de versões por major.
#
# Article I (Configuration-Driven): nenhuma versão de tecnologia vive no corpo de um
# agente nem em código Python. Tudo é resolvido aqui, indexado pelo major lido de
# `project-config.yaml → tobe_stack.frontend_version`.
#
# Major não listado abaixo => o gerador reprova com ERROR nomeando os suportados.
# NUNCA adivinhar versão: preferimos bloquear a gerar um projeto que não compila.
#
# Escopo deliberado das dependências:
#   - @angular/* e @angular/{cdk,material} acompanham o mesmo major do core, então o
#     casamento de peer-dependencies é garantido.
#   - NgRx e MSAL NÃO entram no scaffold. São matrizes de versão de outros fornecedores,
#     com peer-deps próprias, e nada no esqueleto os importa. Uma dependência que ninguém
#     usa só acrescenta risco de `npm install` falhar — que é exatamente a falha que este
#     scaffold existe para eliminar. Quem os introduz é o codegen de features
#     (`coder-angular-frontend`, `build-cycle-ngrx-agent`), junto com o código que os usa.

default_major: 17

supported_majors: ["17", "18", "19", "20"]

majors:
