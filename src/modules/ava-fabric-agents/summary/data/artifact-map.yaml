# ─────────────────────────────────────────────────────────────────
# F8 — SUMMARY (cross-cutting)
# Added 2026-08-18 (spec 041-summary-self-validation-remediation, Task 3.3)
# Gap confirmed by audit: absent from v1.0.1.
# Required by _c12da_3 (missing_artifact) to avoid false-negatives for
# Summary outputs (HTML, validation-report, deep-audit-report, remediation-report).
# ─────────────────────────────────────────────────────────────────
f8_summary:

  ava-summary:
    primary_output: "project/outputs/summary/AVA-FABRIC-SUMMARY-{PROJECT_NAME}-{DATE}.html"
    html_section: "s-f8-summary"
    outputs_map:
      summary_html:
        path: "project/outputs/summary/"
        section: "s-f8-summary"
        extract: "glob AVA-FABRIC-SUMMARY-*.html → most recent"
        note: "Filename includes project name and date; glob required"
      validation_report_md:
        path: "project/outputs/summary/validation-report.md"
        section: "s-f8-summary"
        extract: "full content → validation log"
      validation_report_json:
        path: "project/outputs/summary/validation-report.json"
        section: "s-f8-summary"
        extract: "json parse → checks array, summary counters"

  ava-summary-validate:
    html_section: "s-f8-summary"
    outputs_map:
      deep_audit_json:
        path: "project/outputs/summary/deep-audit-report.json"
        section: "s-f8-summary"
        extract: "json parse → findings array, summary.promotable"
        note: "Emitted only when validate_summary.py is invoked with --deep"

  ava-summary-remediation:
    html_section: "s-f8-summary"
    outputs_map:
      remediation_report_json:
        path: "project/outputs/summary/remediation-report.json"
        section: "s-f8-summary"
        extract: "json parse → final_status, attempts, corrections_applied, forced"
        note: "Schema v2.0; field 'forced' always present; schema_version: '2.0'"


# ─────────────────────────────────────────────────────────────────
# ELEMENT CORRELATION MAP
# Added: spec 042-summary-item-correlation (2026-08-19)
# Audited & corrected: Clarification Q2+Q3 (2026-08-19) — full
#   cross-reference against summary-template.html and validate_summary.py
#   regression guards C11.10/C11.15. See §Clarifications for detail.
# Purpose: Maps HTML element ids (tables/lists with fixed ids in the
#   template) to their D.* field, origin artifact, responsible agent,
#   and JavaScript render function. Consumed exclusively by _c12da_6
#   and _c12da_7 in validate_summary.py to resolve section/agent_responsible
#   and classify the root cause of empty tables/lists.
# Source of truth: summary-template.html (id= attributes + JS functions)
#   NOT summary-agent.md §"Data Source Mapping" (confirmed outdated for
#   2 dead entries and 5 wrong ids — see Clarification Q2).
# Extend this section whenever a new fixed-id table or list is added to the template.
# ─────────────────────────────────────────────────────────────────
html_element_correlation:

  # ── F1 AS-IS ───────────────────────────────────────────────────
  # NOTE: all artifact_path values are relative to projects/{project_name}/
  # i.e. ctx.project_dir / artifact_path — do NOT use "project/" prefix.

