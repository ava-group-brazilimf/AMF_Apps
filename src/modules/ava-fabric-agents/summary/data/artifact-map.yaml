# AVA Fabric Summary — Artifact Map
# Mapeamento: output de cada agente → seção do HTML Summary

version: "1.1.0"
description: |
  Este arquivo define o mapeamento canônico entre os arquivos gerados
  por cada agente e as seções do HTML Summary. Usado pelo Step 02
  do workflow generate-summary para extração e injeção de dados.

# ─────────────────────────────────────────────────────────────────
# F1 — DIAGNÓSTICO AS-IS
# ─────────────────────────────────────────────────────────────────
f1_asis:

  ava-asis-orchestrator:
    primary_output: "project/outputs/asis/master-report.md"
    html_section: "s-kpis"
    data_extracted:
      - field: "exec_summary"
        from: "master-report.md"
        method: "read entire file"

  # AS-IS solution agent — keyed by resolved agent name (depends on legacy_technology)
  # Currently registered: delphi and vb6. Other stubs will be added as they are implemented.
  ava-asis-solution-delphi:
    primary_output: "project/outputs/asis/architecture-blueprint.md"
    html_sections:
      - "s-asis-arch"   # C4 blueprints + padrões
      - "s-asis-bc"     # Bounded contexts
    outputs_map:
      architecture_blueprint:
        path: "project/outputs/asis/architecture-blueprint.md"
        section: "s-asis-arch"
        extract: "full content"
      c4_context:
        path: "project/outputs/asis/diagrams/c4-context.mmd"
        section: "s-asis-arch"
        inject_into: "diagram-box#c4-ctx"
      c4_container:
        path: "project/outputs/asis/diagrams/c4-container.mmd"
        section: "s-asis-arch"
        inject_into: "diagram-box#c4-cnt"
      bounded_contexts:
        path: "project/outputs/asis/bounded-context-map.md"
        section: "s-asis-bc"
        extract: "table rows starting with |"
      pattern_classifications:
        path: "project/outputs/asis/pattern-classifications.json"
        section: "s-asis-arch"
        extract: "json parse → patterns array"
      api_map:
        path: "project/outputs/asis/api-map.md"
        section: "s-tobe-api"
      data_structure:
        path: "project/outputs/asis/db/data-structure.md"
        section: "s-asis-db"

  ava-asis-documentation:
    primary_output: "project/outputs/asis/docs/functional-requirements.md"
    html_sections:
      - "s-asis-docs"   # Requisitos funcionais
      - "s-asis-rules"  # Regras de negócio
      - "s-asis-screens" # Fluxo de telas
    outputs_map:
      value_chain:
        path: "project/outputs/asis/docs/value-chain.md"
        section: "s-asis-docs"
      functional_reqs:
        path: "project/outputs/asis/docs/functional-requirements.md"
        section: "s-asis-docs"
        extract: "table rows | ID | Descrição | Módulo"
        badge: "req-badge"
      business_rules:
        path: "project/outputs/asis/docs/business-rules.md"
        section: "s-asis-rules"
        extract: "table rows | ID | Regra"
        badge: "rules-badge"
      screen_flow:
        path: "project/outputs/asis/docs/screen-navigation-map.md"
        section: "s-asis-screens"
      screen_rules:
        path: "project/outputs/asis/docs/screen-rules.md"
        section: "s-asis-screens"

  ava-asis-bridge-fastqa:
    primary_output: "project/outputs/asis/qa/test-gaps.md"
    html_section: "s-asis-qa"
    outputs_map:
      test_gaps:
        path: "project/outputs/asis/qa/test-gaps.md"
        section: "s-asis-qa"
        extract: "table rows"
      test_plan_asis:
        path: "project/outputs/asis/qa/test-plan.md"
        section: "s-asis-qa"
        extract: "full content"
        note: "Test Plan generated by ava-asis-bridge-fastqa (5 sections: Strategy → Quality Gates)"
      test_cases:
        path: "project/outputs/asis/qa/test-cases.md"
        section: "s-asis-qa"

  ava-asis-security-orchestrator:
    primary_output: "project/outputs/asis/security-map.md"
    html_sections:
      - "s-asis-sec"    # OWASP findings
      - "s-risks"       # contribui ao risk register
    outputs_map:
      security_map:
        path: "project/outputs/asis/security-map.md"
        section: "s-asis-sec"
        extract: "grep Crítico|Alto|Médio → OWASP table"
      vulnerabilities:
        path: "project/outputs/asis/vulnerabilities.md"
        section: "s-asis-sec"
        badge: "owasp-badge"
      compliance_gaps:
        path: "project/outputs/asis/compliance-gaps.md"
        section: "s-asis-sec"

  ava-asis-inventory:
    primary_output: "project/outputs/asis/inventory-report.md"
    html_section: "s-asis-inv"
    outputs_map:
      inventory_report:
        path: "project/outputs/asis/inventory-report.md"
        section: "s-asis-inv"
        extract: "kpi grid values: LOC, classes, methods, layers"
      metrics_json:
        path: "project/outputs/asis/metrics.json"
        section: "s-kpis"
        extract: "all numeric fields → KPI grid"
      complexity_map:
        path: "project/outputs/asis/complexity-map.md"
        section: "s-asis-inv"
        extract: "table rows "

  ava-asis-gaps-risks:
    primary_output: "project/outputs/asis/gaps-risks-report.md"
    html_sections:
      - "s-risks"
      - "s-kpis"
    outputs_map:
      gaps_risks_report:
        path: "project/outputs/asis/gaps-risks-report.md"
        section: "s-risks"
        extract: "risk register table"
        badge: "risk-total-badge"
      risk_register:
        path: "project/outputs/asis/risk-register.json"
        section: "s-risks"
        extract: "json parse → risks array"
      migration_risks:
        path: "project/outputs/asis/migration-risks-summary.md"
        section: "s-risks"

  ava-asis-gap-migration-analyzer:
    primary_output: "project/outputs/asis/gap-list-report.md"
    html_section: "s-asis-gaps"
    outputs_map:
      gap_list_report:
        path: "project/outputs/asis/gap-list-report.md"
        section: "s-asis-gaps"
        extract: "full content"
      gap_register:
        path: "project/outputs/asis/gap-register.json"
        section: "s-asis-gaps"
        extract: "json parse → gaps array"
      gap_analysis_summary:
        path: "project/outputs/asis/gap-analysis-summary.md"
        section: "s-asis-gaps"
        extract: "full content"

  ava-asis-db-analyzer:
    primary_output: "project/outputs/asis/db/schema-inventory.md"
    html_section: "s-asis-db"
    outputs_map:
      db_type:
        path: "project/outputs/asis/db/db-type.json"
        section: "s-asis-db"
        extract: "vendor, version"
        inject_kpi: "db-kpi-grid"
      schema_inventory:
        path: "project/outputs/asis/db/schema-inventory.md"
        section: "s-asis-db"
        extract: "table rows → schema-tbody"
      er_diagram:
        path: "project/outputs/asis/db/er-diagram.mmd"
        section: "s-asis-db"
        inject_into: "diagram-box#er-diagram"
      sp_map:
        path: "project/outputs/asis/db/stored-procedures-map.md"
        section: "s-asis-db"
        extract: "table rows → sp-tbody"
        badge: "sp-badge"
      business_logic:
        path: "project/outputs/asis/db/business-logic-in-db.md"
        section: "s-risks"
        extract: "risk entries → add to risk register"
      quality_report:
        path: "project/outputs/asis/db/db-quality-report.md"
        section: "s-asis-db"

  ava-asis-events-pubsub:
    primary_output: "project/outputs/asis/events-pubsub-inventory.md"
    html_section: "s-asis-events"
    outputs_map:
      events_inventory:
        path: "project/outputs/asis/events-pubsub-inventory.md"
        section: "s-asis-events"
        extract: "full grid tables → events-tbody"
      events_grid_json:
        path: "project/outputs/asis/events-pubsub-grid.json"
        section: "s-asis-events"
        extract: "json parse → events array with occurrences count"
        badge: "events-badge"
      events_flow_diagram:
        path: "project/outputs/asis/diagrams/events-pubsub-flow.mmd"
        section: "s-asis-events"
        inject_into: "diagram-box#events-flow"
      events_risks:
        path: "project/outputs/asis/events-pubsub-risks.md"
        section: "s-risks"
        extract: "risk matrix → add to risk register"

# ─────────────────────────────────────────────────────────────────
# F2 — ARQUITETURA TO-BE
# ─────────────────────────────────────────────────────────────────
f2_tobe:

  ava-tobe-architecture-design:
    primary_output: "project/outputs/tobe/docs/architecture-blueprint.md"
    html_sections:
      - "s-tobe-arch"
      - "s-tobe-api"
    outputs_map:
      tobe_c4_diagrams:
        path: "project/outputs/tobe/diagrams/"
        section: "s-tobe-arch"
        inject_into: "diagram-box#tobe-c4"
      architecture_blueprint_diagram:
        path: "project/outputs/tobe/diagrams/architecture-blueprint.mmd"
        section: "s-tobe-arch"
        inject_into: "diagram-box#tobe-arch-blueprint"
        extract: "mermaid content → sanitize_mmd()"
      architecture_blueprint_html:
        path: "project/outputs/tobe/architecture-blueprint.html"
        section: "s-tobe-arch"
        extract: "standalone HTML — linked, not embedded in summary"
      bounded_contexts_tobe:
        path: "project/outputs/tobe/bounded-context-map.md"
        section: "s-tobe-arch"
        extract: "table rows → tobebc-tbody"
      api_map_tobe:
        path: "project/outputs/tobe/api-map.md"
        section: "s-tobe-api"
        extract: "endpoint table → endpoints-tbody"
        badge: "ep-badge"
      user_journeys:
        path: "project/outputs/tobe/user-journeys.md"
        section: "s-tobe-arch"

  ava-tobe-architecture-technical:
    primary_output: "project/outputs/tobe/docs/tech-framework-document.md"
    html_section: "s-tobe-tech"
    outputs_map:
      nuget_packages:
        path: "project/outputs/tobe/nuget-packages.md"
        section: "s-tobe-tech"
        extract: "table rows → packages-tbody"
        alternatives:
          - "project/outputs/tobe/source-code/backend/Directory.Packages.props"
      solution_structure:
        path: "project/outputs/tobe/solution-structure.md"
        section: "s-tobe-tech"
        inject_into: "diagram-box#solution-structure"
      coding_standards:
        path: "project/outputs/tobe/coding-standards.md"
        section: "s-tobe-tech"
      quality_gates:
        path: "project/outputs/tobe/config/quality-gates.md"
        section: "s-tobe-tech"
        extract: "checklist items → qgates-list"
      patterns_applied:
        path: "project/outputs/tobe/patterns-applied.json"
        section: "s-tobe-tech"
        extract: "patterns[] → tobe-patterns-tbody"

  ava-docs-tobe:
    primary_output: "project/outputs/tobe/docs/regras-negocio.md"
    html_section: "s-f2-bn-tobe"
    outputs_map:
      business_rules_tobe:
        path: "project/outputs/tobe/docs/regras-negocio.md"
        section: "s-f2-bn-tobe"
        extract: |
          - header block: trace_id, generated_at, source_files → tobebn metadata
          - metrics table: Total | Preserved | Fixed | Eliminated | Critical | BCs | Coverage → kpi-bn-tobe grid
          - traceability table rows (| ID | Regra | BC | Decisão | Elemento | Impacto) → tobebn.traceability
          - per-BC rule tables → tobebn.byBc[{ bc, squadOwner, rules: [{id, rule, origin, ddd, enforcement}] }]
          - new rules section → tobebn.newRules
        badge: "bn-tobe-badge"

  ava-tobe-measure-size:
    primary_output: "project/outputs/tobe/docs/sizing-report.md"
    html_section: "s-tobe-size"
    outputs_map:
      sizing_report:
        path: "project/outputs/tobe/sizing-report.md"
        section: "s-tobe-size"
        extract: "kpis: total_sp, total_fp, team_size → size-kpi-grid"
      effort_calculator:
        path: "project/outputs/tobe/effort-calculator.md"
        section: "s-tobe-size"
        extract: "effort table → effort-tbody"
      infra_sizing:
        path: "project/outputs/tobe/infra-sizing.md"
        section: "s-tobe-size"
        extract: "azure resources table → infra-tbody"
      cost_estimate:
        path: "project/outputs/tobe/cost-estimate.md"
        section: "s-tobe-size"
        extract: "monthly cost → inject into size-kpi-grid"

  ava-tobe-migration-plan:
    primary_output: "project/outputs/tobe/docs/migration-plan.md"
    html_section: "s-tobe-migration"
    outputs_map:
      wave_plan:
        path: "project/outputs/tobe/docs/wave-plan.md"
        section: "s-tobe-migration"
        extract: "wave table rows → waves-tbody"
      gantt_chart:
        path: "project/outputs/tobe/migration-gantt.mmd"
        section: "s-tobe-migration"
        inject_into: "diagram-box#gantt-diagram"
      ado_items:
        path: "project/outputs/tobe/ado-work-items.md"
        section: "s-tobe-migration"

  ava-docs-tobe:
    primary_output: "project/outputs/tobe/docs/technical-design-document.md"
    html_section: "s-tobe-tech"
    outputs_map:
      openapi:
        path: "project/outputs/tobe/docs/openapi/"
        section: "s-tobe-api"
      tdd:
        path: "project/outputs/tobe/docs/technical-design-document.md"
        section: "s-tobe-tech"
      changelog:
        path: "project/outputs/tobe/docs/CHANGELOG.md"
        section: "s-tobe-tech"

  ava-test-plan-tobe:
    primary_output: "project/outputs/tobe/qa/test-plan.md"
    html_section: "s-tobe-testplan"
    outputs_map:
      test_plan:
        path: "project/outputs/tobe/qa/test-plan.md"
        section: "s-tobe-testplan"
        extract: "strategy table → testplan-tbody"
      functional_tests:
        path: "project/outputs/tobe/qa/functional-test-matrix.md"
        section: "s-tobe-testplan"
      traceability_matrix:
        path: "project/outputs/tobe/tests/traceability-matrix.md"
        section: "s-tobe-testplan"
      automatable_cases:
        path: "project/outputs/tobe/tests/automatable-test-cases.md"
        section: "s-tobe-testplan"
        note: "Casos de teste formalizados com dados de entrada/saída para automação"

# ─────────────────────────────────────────────────────────────────
# F3 — PROTÓTIPO
# Added 2026-08-18 (spec 041-summary-self-validation-remediation, Task 3.2)
# Gap confirmed by audit: absent from v1.0.1 (phase added in Constitution v1.4.0).
# Required by _c12da_3 (missing_artifact) to classify prototype outputs correctly.
# ─────────────────────────────────────────────────────────────────
f3_prototype:

  ava-prototype:
    primary_output: "project/outputs/tobe/prototype/index.html"
    html_section: "s-f3-proto"
    outputs_map:
      index_html:
        path: "project/outputs/tobe/prototype/index.html"
        section: "s-f3-proto"
        extract: "standalone HTML prototype — linked, not embedded in summary"
      demo_script:
        path: "project/outputs/tobe/prototype/demo-script.md"
        section: "s-f3-proto"
        extract: "full content → walkthrough steps"
      figma_spec:
        path: "project/outputs/tobe/prototype/figma-spec.md"
        section: "s-f3-proto"
        extract: "full content → design token mapping"
      design_traceability:
        path: "project/outputs/tobe/prototype/design-input-traceability.json"
        section: "s-f3-proto"
        extract: "json parse → traceability records (source, tokens applied, gaps)"
        note: "Added in spec 039-prototype-design-input (2026-08-10)"

# ─────────────────────────────────────────────────────────────────
# F3/F4 — STACK & PROTÓTIPO
# ─────────────────────────────────────────────────────────────────
f3_stack:
  ava-stack-dotnet-backend:
    html_section: "s-stack-be"
    outputs_map:
      source_code_module: { path: "project/outputs/tobe/source-code/", section: "s-stack-be" }
      test_code:          { path: "project/outputs/tobe/source-code/", section: "s-stack-be" }
      migrations:         { path: "project/outputs/tobe/source-code/Migrations/", section: "s-stack-be" }

  ava-stack-angular-frontend:
    html_section: "s-stack-fe"
    outputs_map:
      frontend_code: { path: "project/outputs/tobe/source-code/frontend/", section: "s-stack-fe" }

  ava-prototype:
    html_section: "s-proto"
    outputs_map:
      prototype:   { path: "project/outputs/tobe/prototype/", section: "s-proto" }
      demo_script: { path: "project/outputs/tobe/prototype/demo-script.md", section: "s-proto" }
      figma_spec:  { path: "project/outputs/tobe/prototype/figma-spec.md", section: "s-proto" }
      design_traceability: { path: "project/outputs/tobe/prototype/design-input-traceability.json", section: "s-proto" }

# ─────────────────────────────────────────────────────────────────
# F3S — SpecKit Planning (spec 039)
# Camada entre o protótipo e a geração de código. `traceability.json` e
# `tasks-progress.json` são a evidência de que o trabalho gerado tem proveniência
# e verificação real — entram no relatório do cliente por isso, não por volume.
# ─────────────────────────────────────────────────────────────────
f3s_speckit:
  ava-speckit-constitution:
    html_section: "s-speckit-constitution"
    primary_output: "project/outputs/tobe/speckit/constitution.md"
    outputs_map:
      constitution: { path: "project/outputs/tobe/speckit/constitution.md", section: "s-speckit-constitution", extract: "full content" }

  ava-speckit-specification:
    html_section: "s-speckit-specs"
    outputs_map:
      specs: { path: "project/outputs/tobe/speckit/specs/", section: "s-speckit-specs" }

  ava-speckit-prototype-spec:
    html_section: "s-speckit-specs"
    outputs_map:
      spec_prototype: { path: "project/outputs/tobe/speckit/specs/", section: "s-speckit-specs" }

  ava-speckit-planning:
    html_section: "s-speckit-plans"
    outputs_map:
      plans: { path: "project/outputs/tobe/speckit/specs/", section: "s-speckit-plans" }

  ava-speckit-tasks:
    html_section: "s-speckit-tasks"
    outputs_map:
      tasks:        { path: "project/outputs/tobe/speckit/specs/", section: "s-speckit-tasks" }
      traceability: { path: "project/outputs/tobe/speckit/traceability.json", section: "s-speckit-tasks" }
      task_state:   { path: "project/outputs/tobe/speckit/tasks-progress.json", section: "s-speckit-tasks" }

  ava-speckit-compliance:
    html_section: "s-speckit-compliance"
    primary_output: "project/outputs/tobe/speckit/compliance-report.md"
    outputs_map:
      compliance_report: { path: "project/outputs/tobe/speckit/compliance-report.md", section: "s-speckit-compliance", extract: "full content" }
      compliance_status: { path: "project/outputs/tobe/speckit/compliance-status.json", section: "s-speckit-compliance" }

  ava-speckit-orchestrator:
    html_section: "s-speckit-constitution"
    outputs_map:
      execution_log: { path: "project/outputs/tobe/speckit/execution-log.json", section: "s-speckit-constitution" }
      design_traceability: { path: "project/outputs/tobe/prototype/design-input-traceability.json", section: "s-proto" }

