  - id: ava-tobe-designer-system
    file: agents/designer-system-tobe.md
  - id: ava-tobe-azure-infra-estimator
    file: agents/azure-infra-estimator-tobe.md

inputs:
  reference_architecture: "src/shared/data/reference-architecture.yaml"
  architecture_backlog: "src/shared/data/architecture-backlog.yaml"
  project_config: "projects/{project_name}/context/project-config.yaml"

outputs:
  base_path: "project/outputs/tobe"
