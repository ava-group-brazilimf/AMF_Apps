name: tobe-architecture
display_name: "Arquitetura TO-BE"
version: "1.3.2"
description: "Agentes especializados em design da arquitetura alvo (stack e versão definidos em project-config.yaml). timing_benchmark_enabled flag controla coleta de timestamps NTP e exibição de tabelas MACRO (por fase) + DETALHE (por agente) com tempo."
agents:
  - id: ava-tobe-orchestrator
    file: agents/orchestrator-tobe.md
  - id: ava-tobe-architecture-decision-matrix
    file: agents/architecture-decision-matrix-tobe.md
  - id: ava-tobe-adr
    file: agents/adr-tobe.md
  - id: ava-tobe-architecture-design
    file: agents/architecture-design-tobe.md
  - id: ava-tobe-database-policy
    file: agents/database-policy-tobe.md
  - id: ava-tobe-database-design
    file: agents/database-design-tobe.md
  - id: ava-tobe-security-design
    file: agents/security-design-tobe.md
  - id: ava-tobe-architecture-technical
    file: agents/architecture-technical-tobe.md
  - id: ava-tobe-measure-size
    file: agents/measure-size-tobe.md
  - id: ava-tobe-migration-plan
    file: agents/migration-plan-tobe.md
  - id: ava-tobe-coexistence-strategy
    file: agents/coexistence-strategy-tobe.md
  - id: ava-tobe-risk-mitigation
    file: agents/risk-mitigation-tobe.md
  - id: ava-tobe-spec
    file: agents/openapi-spec-tobe.md
