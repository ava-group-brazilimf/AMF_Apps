name: prototype
display_name: "Prototype TO-BE"
version: "1.3.0"
description: "Agente de prototipação navegável da solução TO-BE para validação com stakeholders"
handoff:
  to: "QA Agents (F5)"
  role: "Gera protótipo navegável HTML, Figma specs e demo script 20-25min"
  reason: "Validar UX, fluxos e decisões de design com stakeholders antes da entrega"
  step: "F4 — Agent 4"

agents:
  - id: ava-prototype
    file: agents/prototype-agent.md
    skill: ava-prototype

outputs:
  base_path: "projects/{project_name}/outputs/tobe/prototype"
  files:
    - "index.html"
    - "demo-script.md"
    - "figma-spec.md"
    - "README.md"
    - "design-tokens.json"
    - "design-input-traceability.json"

# Pode ser ativado independentemente após F3 (Stack Tecnológica) ou como parte da esteira completa
standalone: false
hooks:
  after: ["ava-tobe-orchestrator"]
  trigger_code: "PT"
